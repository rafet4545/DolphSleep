<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="icon-192.png">
<title>DolphSleep</title>
<style>
:root{
  --bg:#0b1026;--bg2:#121a3a;--kart:rgba(10,16,44,.4);--cizgi:rgba(255,255,255,.1);
  --yazi:#eef0ff;--soluk:#9aa3c7;--ay:#ffd98a;--mor:#8d7bff;--yesil:#4fe0a0;--kirmizi:#ff6b7f;--sari:#ffc857;--mavi:#6ab8e4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:radial-gradient(120% 70% at 50% 0%,#1d2660 0%,var(--bg) 60%) fixed,var(--bg);color:var(--yazi);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;height:100vh;height:100dvh;overflow:hidden;overscroll-behavior:none}
.yildiz{position:fixed;inset:0;pointer-events:none;z-index:0}
main{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 6px;max-width:492px;width:100%;margin:0 auto;flex:none}
.logo{display:flex;align-items:center;gap:10px}
.logo img{width:40px;height:40px;border-radius:11px}
header h1{font-size:20px;margin:0;letter-spacing:.2px}
header small{color:var(--soluk);font-size:13px}
.hesapBtn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);border:1px solid var(--cizgi);color:var(--yazi);border-radius:99px;padding:6px 12px 6px 6px;font-size:13px;cursor:pointer;max-width:48%}
.hesapBtn img,.hesapBtn .bos{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.1);font-size:14px}
.hesapBtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saat{font-size:56px;font-weight:800;text-align:center;margin:14px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:1px}
.durum{text-align:center;color:var(--soluk);font-size:15px;min-height:22px}
.buyuk{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:200px;height:200px;margin:22px auto 10px;border-radius:50%;border:0;cursor:pointer;color:#1a1300;font-weight:800;font-size:20px;
  background:radial-gradient(circle at 35% 30%,#fff3cf,var(--ay) 55%,#d9a441);box-shadow:0 0 0 10px rgba(255,217,138,.08),0 0 60px rgba(255,217,138,.35);transition:transform .15s;font-family:inherit}
.buyuk:active{transform:scale(.96)}
.buyuk .e{font-size:54px;line-height:1}
.buyuk.uyanik{color:#fff;background:radial-gradient(circle at 35% 30%,#b9b0ff,var(--mor) 55%,#4a3bc9);box-shadow:0 0 0 10px rgba(141,123,255,.1),0 0 60px rgba(141,123,255,.45);animation:nefes 4s ease-in-out infinite}
@keyframes nefes{50%{box-shadow:0 0 0 18px rgba(141,123,255,.06),0 0 80px rgba(141,123,255,.55)}}
.hedef{text-align:center;color:var(--soluk);font-size:13px;margin-bottom:12px}
.hedef b{color:var(--yazi)}
.uyari{display:flex;align-items:center;gap:10px;background:rgba(255,200,87,.12);border:1px solid rgba(255,200,87,.35);border-radius:16px;padding:12px 14px;margin:10px 0;font-size:14px}
.uyari b{display:block}
.uyari button{margin-left:auto;flex:none}
.kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:20px;padding:16px;margin:14px 0;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.kart h2{font-size:15px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.kart h2 small{color:var(--soluk);font-weight:500;font-size:12px}
.istat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ist{background:rgba(255,255,255,.04);border-radius:14px;padding:12px}
.ist b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.ist span{color:var(--soluk);font-size:12px}
.ist.iyi b{color:var(--yesil)}.ist.kotu b{color:var(--kirmizi)}.ist.orta b{color:var(--sari)}
svg.graf{width:100%;height:auto;display:block}
.gece{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--cizgi)}
.gece:first-child{border-top:0}
.gece .g{width:62px;font-size:13px;color:var(--soluk)}
.gece .g b{display:block;color:var(--yazi);font-size:14px}
.gece .s{flex:1;font-size:14px;font-variant-numeric:tabular-nums}
.gece .s small{display:block;color:var(--soluk);font-size:12px}
.etk{font-size:12px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.07);white-space:nowrap}
.etk.ok{color:var(--yesil)}.etk.no{color:var(--kirmizi)}.etk.er{color:var(--sari)}
.gece button{background:none;border:0;color:var(--soluk);font-size:16px;cursor:pointer;padding:6px}
.kucuk{background:rgba(255,255,255,.07);border:1px solid var(--cizgi);color:var(--yazi);border-radius:12px;padding:10px 14px;font-size:14px;cursor:pointer;font-family:inherit}
.bos{color:var(--soluk);font-size:14px;text-align:center;padding:10px 0}
.alt{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.perde{position:fixed;inset:0;background:rgba(5,8,20,.7);display:none;align-items:flex-end;justify-content:center;z-index:10;backdrop-filter:blur(4px)}
.perde.ac{display:flex}
.sayfa{background:var(--bg2);border:1px solid var(--cizgi);border-radius:24px 24px 0 0;width:100%;max-width:460px;padding:20px 18px calc(22px + env(safe-area-inset-bottom));animation:yuk .25s ease-out;max-height:90vh;overflow:auto}
@keyframes yuk{from{transform:translateY(40px);opacity:0}}
.sayfa h3{margin:0 0 4px;font-size:19px}
.sayfa p{margin:0 0 14px;color:var(--soluk);font-size:14px;line-height:1.45}
.sec{display:flex;gap:8px;margin-bottom:16px}
.sec button{flex:1;padding:12px 4px;border-radius:14px;border:1px solid var(--cizgi);background:rgba(255,255,255,.05);color:var(--yazi);font-size:24px;cursor:pointer;font-family:inherit}
.sec.yazi button{font-size:14px}
.sec button.on{border-color:var(--ay);background:rgba(255,217,138,.15)}
.ana{width:100%;padding:14px;border:0;border-radius:14px;background:var(--ay);color:#1a1300;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}
.ana:disabled{opacity:.4}
.ana.mavi{background:#fff;color:#1f1f1f;display:flex;align-items:center;justify-content:center;gap:10px}
.ikinci{width:100%;margin-top:10px;padding:13px;border-radius:14px;border:1px solid var(--cizgi);background:rgba(255,255,255,.06);color:var(--yazi);font-size:15px;cursor:pointer;font-family:inherit}
.alan{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.alan label{font-size:12px;color:var(--soluk)}
.alan input{width:100%;margin-top:4px;padding:10px;border-radius:12px;border:1px solid var(--cizgi);background:rgba(255,255,255,.06);color:var(--yazi);font-size:15px;color-scheme:dark;font-family:inherit}
.sonuc{text-align:center;padding:6px 0 14px}
.sonuc .b{font-size:40px;font-weight:800}
.satir{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--cizgi)}
.satir:first-of-type{border-top:0}
.satir .yz{flex:1;font-size:15px}.satir .yz small{display:block;color:var(--soluk);font-size:12px;margin-top:2px}
.dugme{width:50px;height:30px;border-radius:99px;border:0;background:rgba(255,255,255,.15);position:relative;cursor:pointer;flex:none}
.dugme::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.dugme.on{background:var(--yesil)}.dugme.on::after{left:23px}
.not{font-size:12px;color:var(--soluk);text-align:center;margin-top:18px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1e2752;border:1px solid var(--cizgi);color:var(--yazi);padding:10px 16px;border-radius:14px;font-size:14px;z-index:20;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.gor{opacity:1}
#giris{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:radial-gradient(120% 70% at 50% 0%,#1d2660 0%,var(--bg) 65%),var(--bg)}
#giris[hidden]{display:none}
#giris [hidden]{display:none!important}
#kurKapi{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:radial-gradient(120% 70% at 50% 0%,#1d2660 0%,var(--bg) 65%),var(--bg)}
#kurKapi[hidden]{display:none}
#kurKapi img{width:110px;height:110px;border-radius:26px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#kurKapi h2{margin:4px 0 0;font-size:24px}#kurKapi p{margin:0;color:var(--soluk);max-width:330px;line-height:1.5}
#kurKapi ol{text-align:left;max-width:330px;margin:4px 0;padding-left:22px;line-height:1.8;font-size:15px}
#kurKapi .ana{max-width:340px}
#kurKapi .sem{display:inline-block;padding:0 6px;border-radius:6px;background:rgba(255,255,255,.12)}
#giris img{width:120px;height:120px;border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#giris h2{margin:6px 0 0;font-size:28px}#giris p{margin:0;color:var(--soluk);max-width:320px;line-height:1.5}
#giris .ana{max-width:340px}
.ustBtn{display:flex;gap:8px}
.lider{display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:14px;margin:4px 0;background:rgba(255,255,255,.04)}
.lider.ben{background:rgba(255,217,138,.13);border:1px solid rgba(255,217,138,.35)}
.lider .sira{width:28px;text-align:center;font-weight:800;font-size:16px}
.lider .ad{flex:1;min-width:0}.lider .ad b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lider .ad small{color:var(--soluk);font-size:12px}
.lider .puan{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.adm{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--cizgi);cursor:pointer}
.adm:first-child{border-top:0}
.adm img,.adm .bos{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.1)}
.adm .yz{flex:1;min-width:0;font-size:14px}.adm .yz b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.adm .yz small{display:block;color:var(--soluk);font-size:12px}
.ozet{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 12px}
.ozet div{background:rgba(255,255,255,.05);border-radius:12px;padding:10px;text-align:center}.ozet b{display:block;font-size:20px}.ozet span{font-size:11px;color:var(--soluk)}
.takmaGir{width:100%;padding:13px;border-radius:14px;border:1px solid var(--cizgi);background:rgba(255,255,255,.06);color:var(--yazi);font-size:16px;margin-bottom:12px;font-family:inherit}
.bulut{font-size:12px;color:var(--soluk);text-align:center;margin-top:6px}
.havaY{text-align:center;color:var(--soluk);font-size:13px;margin-top:4px;min-height:18px}
body.aydin{--soluk:#e6ebff;--cizgi:rgba(255,255,255,.18)}
main{text-shadow:0 1px 8px rgba(0,20,60,.4)}
body.aydin .kart,body.aydin .yeniRuya,body.aydin .uyari,body.aydin .kapanBtn,body.aydin .kapanisK{text-shadow:none}
.yildiz{background:var(--bg)}
.copO{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--cizgi)}
.copO:first-child{border-top:0}
.copO .yz{flex:1;min-width:0;font-size:14px}.copO .yz b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.copO .yz small{color:var(--soluk);font-size:12px}
.copO button{flex:none;background:rgba(255,255,255,.07);border:1px solid var(--cizgi);color:var(--yazi);border-radius:10px;padding:7px 10px;font-size:13px;cursor:pointer;font-family:inherit}
.copO button.kr{color:var(--kirmizi)}
/* ---------- v5: kaydırmalı sekmeler ---------- */
#kaydir{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
#kaydir::-webkit-scrollbar{display:none}
.sekme{flex:0 0 100%;width:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;overflow-x:hidden;padding:0 16px calc(118px + env(safe-area-inset-bottom));overscroll-behavior-y:contain}
.sekme .ic{max-width:460px;margin:0 auto}
.baslikS{font-size:26px;font-weight:800;margin:14px 0 2px;letter-spacing:.2px}
.altS{color:var(--soluk);font-size:14px;margin:0 0 14px}
/* liquid glass sekme çubuğu */
#cubuk{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:8;display:grid;grid-template-columns:repeat(3,88px);padding:6px;border-radius:999px;isolation:isolate;touch-action:none;user-select:none;-webkit-user-select:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.12),inset 1px 0 0 rgba(255,255,255,.12),inset -1px 0 0 rgba(255,255,255,.12),0 10px 30px rgba(0,0,0,.28);transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
#cubuk::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-2;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.02) 50%,rgba(255,255,255,.06));
  -webkit-backdrop-filter:blur(5px) saturate(180%) brightness(1.05);backdrop-filter:blur(5px) saturate(180%) brightness(1.05)}
#cubuk::before{content:"";position:absolute;inset:1px 16% auto;height:42%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0));pointer-events:none;z-index:-1}
#cubuk.tut{transform:translateX(-50%) scale(1.04)}
#cubuk button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border:0;background:none;color:rgba(255,255,255,.72);font-family:inherit;cursor:pointer;transition:color .25s;text-shadow:0 1px 3px rgba(0,0,0,.35);touch-action:none}
#cubuk button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
#cubuk button svg .dolu{fill:currentColor;stroke:none}
#cubuk button small{font-size:11px;font-weight:600;letter-spacing:.2px}
#cubuk button.on{color:#fff}
#cubuk button.on svg{transform:scale(1.1)}
.lens{position:absolute;top:6px;left:6px;width:88px;bottom:6px;border-radius:999px;z-index:2;pointer-events:none;
  background:radial-gradient(120% 140% at 30% 0%,rgba(255,255,255,.22),rgba(255,255,255,.03) 55%,rgba(255,255,255,.07));
  box-shadow:inset 0 1px 1.5px rgba(255,255,255,.85),inset 0 -1px 1px rgba(255,255,255,.35),inset 1px 0 1px rgba(255,255,255,.3),inset -1px 0 1px rgba(255,255,255,.3),inset 0 -10px 16px rgba(255,255,255,.06),0 4px 14px rgba(0,0,0,.18);
  -webkit-backdrop-filter:brightness(1.06);backdrop-filter:brightness(1.06);
  transform:translateX(0);will-change:transform;transition:background .25s,box-shadow .25s}
.lens.tut{background:radial-gradient(120% 140% at 30% 0%,rgba(255,255,255,.2),rgba(255,255,255,.02) 55%,rgba(255,255,255,.06));box-shadow:inset 0 1px 2px rgba(255,255,255,1),inset 0 -1px 1.5px rgba(255,255,255,.5),inset 1px 0 1px rgba(255,255,255,.45),inset -1px 0 1px rgba(255,255,255,.45),0 14px 30px rgba(0,0,0,.38),0 3px 8px rgba(0,0,0,.2);-webkit-backdrop-filter:blur(1px) brightness(1.12);backdrop-filter:blur(1px) brightness(1.12)}
.lens.yay{transition:transform .5s cubic-bezier(.25,1.45,.45,1),background .25s,box-shadow .25s}
#cubuk button.hedef svg{transform:scale(1.25)}
#cubuk button.hedef{color:#fff}
/* rüyalar */
.kilitEkran{text-align:center;padding:40px 6px 10px}
.kilitEkran .kilitI{width:92px;height:92px;margin:0 auto 14px;border-radius:28px;display:grid;place-items:center;font-size:44px;background:linear-gradient(160deg,rgba(141,123,255,.35),rgba(106,184,228,.15));border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 20px 50px rgba(0,0,0,.35)}
.kilitEkran h3{margin:0 0 6px;font-size:22px}.kilitEkran p{color:var(--soluk);margin:0 0 18px;font-size:14px;line-height:1.5}
.sifreIn{width:100%;padding:14px;border-radius:14px;border:1px solid var(--cizgi);background:rgba(255,255,255,.06);color:var(--yazi);font-size:17px;margin-bottom:10px;font-family:inherit;text-align:center;letter-spacing:2px}
.sifreIn::placeholder{letter-spacing:0}
.ust3{display:flex;gap:8px;margin-bottom:12px}
.ust3 .kucuk{flex:1;padding:12px 8px}
.yeniRuya{width:100%;display:flex;align-items:center;gap:12px;padding:16px;border-radius:20px;border:1px solid rgba(141,123,255,.45);background:linear-gradient(135deg,rgba(141,123,255,.32),rgba(106,184,228,.12));color:var(--yazi);font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;text-align:left;margin-bottom:4px}
.yeniRuya span:first-child{font-size:30px}.yeniRuya small{display:block;font-weight:500;color:var(--soluk);font-size:13px}
.takvimB{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.takvimB button{background:rgba(255,255,255,.07);border:1px solid var(--cizgi);color:var(--yazi);width:36px;height:36px;border-radius:12px;font-size:18px;cursor:pointer}
.takvimB b{font-size:16px;cursor:pointer}
.takvim{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.takvim .gb{font-size:11px;color:var(--soluk);text-align:center;padding-bottom:2px}
.gh{min-width:0;overflow:hidden;height:0;padding:0 0 100%!important;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid transparent;color:var(--soluk);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;cursor:pointer;font-family:inherit;padding:0;line-height:1.1}
.gh{position:relative;box-sizing:border-box}
.gh .gs{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.gh i{font-style:normal;font-size:15px;line-height:1}
.gh.var{background:rgba(141,123,255,.16);color:var(--yazi);border-color:rgba(141,123,255,.35)}
.gh.yok{opacity:.55}
.gh.bugun{border-color:var(--ay)}
.gh.yer{visibility:hidden}
.gh.secili{background:rgba(255,217,138,.2);border-color:var(--ay)}
.yilG{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.yilG button{padding:14px 6px;border-radius:14px;border:1px solid var(--cizgi);background:rgba(255,255,255,.05);color:var(--yazi);font-family:inherit;cursor:pointer;font-size:14px}
.yilG button b{display:block;font-size:20px;margin-top:2px}.yilG button.dolu{border-color:rgba(141,123,255,.45);background:rgba(141,123,255,.13)}
.rk{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:16px;margin:8px 0;background:rgba(255,255,255,.045);border:1px solid var(--cizgi);color:var(--yazi);font-family:inherit;cursor:pointer}
.rk .rkU{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.rk .rkU b{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .rkU small{color:var(--soluk);font-size:12px;flex:none}
.rk p{margin:0;color:var(--soluk);font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.etiketS{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}

<script>
var SURUM = 9;
document.getElementById("surum").textContent = SURUM;
var HEDEF = { yatBas: 23*60, yatSon: 23*60+30, kalk: 7*60+30, kalkTol: 15, sure: 8*60, hatirlat: 22*60+30 };
var KEY = "dolphsleep.v1", AYAR_KEY = "dolphsleep.ayar.v1";

/* ---------- veri ---------- */
function bosVeri(){ return { geceler:[], aktif:null, aktifT:0, silinen:{} }; }
function oku(){ try{ var v = JSON.parse(localStorage.getItem(KEY)); if(v && v.geceler){ v.silinen = v.silinen || {}; v.aktifT = v.aktifT || 0; v.geceler.forEach(function(g){ if(!g.id) g.id = "g"+g.y; if(!g.t) g.t = g.k || Date.now(); }); return v; } }catch(e){} return bosVeri(); }
var veri = oku();
var ayar = (function(){ try{ return JSON.parse(localStorage.getItem(AYAR_KEY)) || {}; }catch(e){ return {}; } })();
function ayarYaz(){ try{ localStorage.setItem(AYAR_KEY, JSON.stringify(ayar)); }catch(e){} }
function yaz(bulutaDa){ try{ localStorage.setItem(KEY, JSON.stringify(veri)); }catch(e){} if(bulutaDa !== false) bulutYukleSonra(); }

/* ---------- yardımcılar ---------- */
function pad(n){ return (n<10?"0":"")+n; }
function hm(ts){ var d = new Date(ts); return pad(d.getHours())+":"+pad(d.getMinutes()); }
function dk(ts){ var d = new Date(ts); return d.getHours()*60 + d.getMinutes(); }
function geceDk(ts){ var m = dk(ts); return m < 12*60 ? m + 1440 : m; }
function sureYaz(m){ m = Math.max(0, Math.round(m)); var h = Math.floor(m/60); return h ? h+" sa "+pad(m%60)+" dk" : (m%60)+" dk"; }
var GUN = ["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"], AY = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
function gunEt(ts){ var d = new Date(ts); return GUN[d.getDay()]+" "+d.getDate()+" "+AY[d.getMonth()]; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]; }); }
var toastZ = 0;
function toast(m){ var t = document.getElementById("toast"); t.textContent = m; t.classList.add("gor"); clearTimeout(toastZ); toastZ = setTimeout(function(){ t.classList.remove("gor"); }, 2600); }

function degerlendir(g){
  var y = geceDk(g.y), k = dk(g.k), s = (g.k - g.y)/60000;
  var yat = y < HEDEF.yatBas ? "er" : y <= HEDEF.yatSon ? "ok" : "no";
  var kalk = Math.abs(k - HEDEF.kalk) <= HEDEF.kalkTol ? "ok" : k < HEDEF.kalk ? "er" : "no";
  return { yat:yat, kalk:kalk, sure:s, tam: yat!=="no" && kalk!=="no" };
}
function aktifGeceler(l){ return (l || veri.geceler).filter(function(g){ return !g.cop; }); }
function sirali(){ return aktifGeceler().slice().sort(function(a,b){ return b.y-a.y; }); }
function sonGeceler(n){ return sirali().slice(0, n); }
function sd(a){ if(a.length<2) return 0; var o = a.reduce(function(x,y){return x+y;},0)/a.length; return Math.sqrt(a.reduce(function(x,y){return x+(y-o)*(y-o);},0)/a.length); }

/* ---------- çizim ---------- */
function ciz(){
  var simdi = Date.now();
  document.getElementById("tarih").textContent = gunEt(simdi);
  var b = document.getElementById("buyuk");
  if(veri.aktif){
    b.classList.add("uyanik"); document.getElementById("buyukE").textContent = "☀️"; document.getElementById("buyukY").textContent = "Uyandım";
    document.getElementById("durum").textContent = hm(veri.aktif)+"'den beri uyuyorsun · "+sureYaz((simdi-veri.aktif)/60000);
  } else {
    b.classList.remove("uyanik"); document.getElementById("buyukE").textContent = "🌙"; document.getElementById("buyukY").textContent = "Uyuyorum";
    var m = dk(simdi), kal = HEDEF.yatSon - m;
    document.getElementById("durum").textContent = (m >= 18*60 && kal > 0) ? "Yatmaya "+sureYaz(kal)+" kaldı" : (m >= HEDEF.yatSon || m < 4*60) ? "Hedef saati geçti, hemen yat 😴" : "İyi günler ☀️";
  }
  uyariCiz(); istatCiz(); grafCiz(); listeCiz(); hesapCiz();
}
function uyariCiz(){
  var k = document.getElementById("uyariKutu"), simdi = Date.now(), m = dk(simdi), h = "";
  if(veri.aktif && simdi - veri.aktif > 16*36e5){
    h = '<div class="uyari"><span>⏰</span><div><b>Uyandım\'a basmayı unuttun</b>'+gunEt(veri.aktif)+' '+hm(veri.aktif)+'\'den beri açık.</div><button class="kucuk" id="uyFix">Düzelt</button></div>';
  } else if(!veri.aktif && m >= 5*60 && m < 15*60){
    var bugun = new Date(); bugun.setHours(0,0,0,0);
    var var_ = aktifGeceler().some(function(g){ return g.k >= bugun.getTime(); });
    var dun = (ayar.unuttumGec || "") === bugun.toDateString();
    if(!var_ && !dun) h = '<div class="uyari"><span>🌙</span><div><b>Dün gece butona basmadın</b>Kaçta yattın, kaçta kalktın?</div><button class="kucuk" id="uyEkle">Ekle</button></div>';
  }
  k.innerHTML = h;
  var f = document.getElementById("uyFix"); if(f) f.onclick = function(){ var d = new Date(veri.aktif + 8*36e5); duzenle(null, { y:veri.aktif, k:d.getTime(), aktifKapat:true }); };
  var e = document.getElementById("uyEkle"); if(e) e.onclick = function(){ duzenle(null); };
}
function istatHesap(geceler){
  var l = geceler.slice().sort(function(a,b){ return b.y-a.y; }), l7 = l.slice(0, 7);
  if(!l7.length) return null;
  var d = l7.map(degerlendir), ort = d.reduce(function(x,y){return x+y.sure;},0)/d.length;
  var borc = d.reduce(function(x,y){ return x + Math.max(0, HEDEF.sure - y.sure); },0);
  var duzen = l7.length > 1 ? Math.max(0, Math.round(100 - (sd(l7.map(function(g){return geceDk(g.y);})) + sd(l7.map(function(g){return dk(g.k);})))/2 * 1.4)) : null;
  var seri = 0; for(var i=0;i<l.length;i++){ if(degerlendir(l[i]).tam) seri++; else break; }
  var ortYat = Math.round(l7.reduce(function(x,g){ return x + geceDk(g.y); },0)/l7.length);
  return { ort:ort, borc:borc, duzen:duzen, seri:seri, hedefte:d.filter(function(x){return x.tam;}).length, n:d.length, ortYat:ortYat };
}
function saatYaz(m){ m = ((Math.round(m) % 1440) + 1440) % 1440; return pad(Math.floor(m/60))+":"+pad(m%60); }
function haftaBas(ts){ var d = new Date(ts || Date.now()); d.setHours(0,0,0,0); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return d; }
function haftaKod(ts){ var d = haftaBas(ts); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
/* haftalık puan: hedefe tam uyulan gece +10, sadece yatış zamanında +5, seri devam ediyorsa +5; haftada en az 3 gece varsa düzen bonusu (düzen/10) */
function haftaPuan(geceler){
  var bas = haftaBas().getTime(), tum = geceler.slice().sort(function(a,b){ return a.y-b.y; }), seri = 0, puan = 0, bu = [];
  tum.forEach(function(g){ var d = degerlendir(g); seri = d.tam ? seri+1 : 0; if(g.k >= bas){ bu.push(g); puan += d.tam ? 10 : (d.yat!=="no" ? 5 : 0); if(d.tam && seri > 1) puan += 5; } });
  if(bu.length >= 3){ var h = istatHesap(bu); if(h && h.duzen!=null) puan += Math.round(h.duzen/10); }
  return { puan:puan, gece:bu.length };
}
function istatCiz(){
  var l = sonGeceler(7), k = document.getElementById("istat");
  if(!l.length){ k.innerHTML = '<div class="bos" style="grid-column:1/-1">Henüz kayıt yok. Bu gece 🌙 butonuna bas.</div>'; return; }
  var h = istatHesap(aktifGeceler()), ort = h.ort, borc = h.borc, duzen = h.duzen || 0, seri = h.seri, hedefte = h.hedefte, d = { length:h.n };
  k.innerHTML =
    ist(sureYaz(ort), "ortalama uyku", ort>=450?"iyi":ort>=390?"orta":"kotu")+
    ist(l.length>1 ? duzen+"/100" : "—", "düzen puanı", l.length<2?"":duzen>=75?"iyi":duzen>=50?"orta":"kotu")+
    ist(borc ? "−"+sureYaz(borc) : "Yok 🎉", "uyku borcu", borc<=60?"iyi":borc<=240?"orta":"kotu")+
    ist(seri+" 🔥", "seri · "+hedefte+"/"+d.length+" gece hedefte", seri>=3?"iyi":seri>=1?"orta":"kotu");
}
function ist(b, s, c){ return '<div class="ist '+c+'"><b>'+b+'</b><span>'+s+'</span></div>'; }
function grafCiz(){ document.getElementById("graf").innerHTML = grafSvg(sonGeceler(7).reverse()); }
function grafSvg(l){
  if(!l.length) return '<div class="bos">Grafik ilk geceden sonra çıkar.</div>';
  var W = 340, H = 230, sol = 40, ust = 10, alt = 26, bas = 21*60, son = 34*60;
  var Y = function(m){ return ust + (Math.min(Math.max(m, bas), son)-bas)/(son-bas)*(H-ust-alt); };

function birlestir(a, b){
  var sil = Object.assign({}, a.silinen || {});
  Object.keys(b.silinen || {}).forEach(function(k){ sil[k] = Math.max(sil[k] || 0, b.silinen[k]); });
  var m = {};
  (a.geceler || []).concat(b.geceler || []).forEach(function(g){ if(!g || !g.id) return; if(!m[g.id] || (g.t || 0) > (m[g.id].t || 0)) m[g.id] = g; });
  var geceler = Object.keys(m).map(function(k){ return m[k]; }).filter(function(g){ return !(sil[g.id] && sil[g.id] >= (g.t || 0)); });
  var akt = (a.aktifT || 0) >= (b.aktifT || 0) ? a : b;
  return { geceler:geceler, aktif:akt.aktif || null, aktifT:akt.aktifT || 0, silinen:sil };
}

/* ---------- sekmeler + liquid glass çubuk ---------- */
var kaydir = document.getElementById("kaydir"), lens = document.getElementById("lens"), cubuk = document.getElementById("cubuk"), cubukB = [].slice.call(document.querySelectorAll("#cubuk button")), aktifSekme = 1, LW = 88, lensRaf = 0;

function sekmeGit(i, hizli){ sonSekme = i; kaydir.scrollTo({ left:i*kaydir.clientWidth, behavior:hizli ? "auto" : "smooth" }); }

/* ---------- şifreleme (AES-GCM, şifreden PBKDF2 ile anahtar) ---------- */
var KRIPTO = { key:null };
function b64(buf){ var s = "", b = new Uint8Array(buf); for(var i=0;i<b.length;i++) s += String.fromCharCode(b[i]); return btoa(s); }
function unb64(s){ var b = atob(s), u = new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i] = b.charCodeAt(i); return u; }
function anahtarTuret(sifre, salt, iter){

    return crypto.subtle.deriveKey({ name:"PBKDF2", salt:unb64(salt), iterations:iter, hash:"SHA-256" }, k, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
  });
}
function sifrele(key, obj){ var iv = crypto.getRandomValues(new Uint8Array(12)); return crypto.subtle.encrypt({ name:"AES-GCM", iv:iv }, key, new TextEncoder().encode(JSON.stringify(obj))).then(function(ct){ return { iv:b64(iv), ct:b64(ct) }; }); }
function coz(key, e){ return crypto.subtle.decrypt({ name:"AES-GCM", iv:unb64(e.iv) }, key, unb64(e.ct)).then(function(p){ return JSON.parse(new TextDecoder().decode(p)); }); }

function gunBirlestir(a, b){
  a = a || bosGun(); b = b || bosGun();
  var sil = Object.assign({}, a.sil || {}); Object.keys(b.sil || {}).forEach(function(k){ sil[k] = Math.max(sil[k] || 0, b.sil[k]); });

    var bk = s[1].exists() ? s[1].data() : null;

      '<button class="ana" id="copHepGeri" style="margin-top:14px">↺ Tümünü geri yükle</button><button class="ikinci" id="copHepSil" style="color:var(--kirmizi)">Hepsini kalıcı olarak sil</button>' :

}
function copSonra(){ if(aktifSekme===S_RUYA) ruyaCiz(); if(aktifSekme===S_GUN) gunCiz(); }

/* =================== gökyüzü =================== */
var TEST = (function(){ try{ var q = new URLSearchParams(location.search); return { saat:q.get("saat"), hava:q.get("hava"), bulut:q.get("bulut") }; }catch(e){ return {}; } })();
function simdiMs(){
  if(TEST.saat){ var p = TEST.saat.split(":"), d = new Date(); d.setHours(+p[0], +(p[1]||0), 0, 0); return d.getTime(); }
  return Date.now();
}
function konum(){ return ayar.konum || { lat:41.01, lon:28.98, istanbul:true }; }
function gunesYuk(ms, lat, lon){
  var rad = Math.PI/180, d = (ms - 946728000000)/864e5;
  var g = (357.529 + .98560028*d)*rad, q = 280.459 + .98564736*d, L = (q + 1.915*Math.sin(g) + .02*Math.sin(2*g))*rad;
  var e = (23.439 - .00000036*d)*rad, ra = Math.atan2(Math.cos(e)*Math.sin(L), Math.cos(L)), dec = Math.asin(Math.sin(e)*Math.sin(L));
  var gmst = ((18.697374558 + 24.06570982441908*d) % 24 + 24) % 24, H = (gmst*15 + lon)*rad - ra;
  return Math.asin(Math.sin(lat*rad)*Math.sin(dec) + Math.cos(lat*rad)*Math.cos(dec)*Math.cos(H))/rad;
}
var gunOn = {};
function gunBilgi(ms){
  var k = konum(), d0 = new Date(ms); d0.setHours(0,0,0,0);
  var key = d0.getTime()+"|"+k.lat+"|"+k.lon; if(gunOn[key]) return gunOn[key];
  var dogus = null, batis = null, max = -90, ogle = d0.getTime()+12*36e5, onceki = gunesYuk(d0.getTime(), k.lat, k.lon);
  for(var m=5; m<=1440; m+=5){
    var t = d0.getTime() + m*6e4, a = gunesYuk(t, k.lat, k.lon);
    if(onceki < -.833 && a >= -.833 && dogus===null) dogus = t - 5*6e4*(a + .833)/(a - onceki);
    if(onceki >= -.833 && a < -.833) batis = t - 5*6e4*(a + .833)/(a - onceki);
    if(a > max){ max = a; ogle = t; } onceki = a;
  }
  return gunOn[key] = { dogus:dogus || d0.getTime()+7*36e5, batis:batis || d0.getTime()+17*36e5, max:Math.max(5, max), ogle:ogle };
}
function ayEvresi(ms){ var f = ((ms - Date.UTC(2000,0,6,18,14))/864e5) % 29.530588853; if(f < 0) f += 29.530588853; return f/29.530588853; }

/* hava durumu (Open-Meteo, anahtarsız) */
var HAVA_AD = { 0:["☀️","Açık"],1:["🌤️","Az bulutlu"],2:["⛅","Parçalı bulutlu"],3:["☁️","Kapalı"],45:["🌫️","Sisli"],48:["🌫️","Kırağılı sis"],
  51:["🌦️","Hafif çisenti"],53:["🌦️","Çisenti"],55:["🌧️","Yoğun çisenti"],56:["🌧️","Donan çisenti"],57:["🌧️","Donan çisenti"],
  61:["🌦️","Hafif yağmur"],63:["🌧️","Yağmurlu"],65:["🌧️","Kuvvetli yağmur"],66:["🌧️","Donan yağmur"],67:["🌧️","Donan yağmur"],
  71:["🌨️","Hafif kar"],73:["🌨️","Karlı"],75:["❄️","Yoğun kar"],77:["🌨️","Kar taneleri"],80:["🌦️","Sağanak"],81:["🌧️","Sağanak"],82:["⛈️","Şiddetli sağanak"],
  85:["🌨️","Kar sağanağı"],86:["❄️","Yoğun kar sağanağı"],95:["⛈️","Gök gürültülü"],96:["⛈️","Dolu ve fırtına"],99:["⛈️","Dolu ve fırtına"] };
var HAVA = null;
function havaGetir(zorla){
  var k = konum(), h = ayar.hava;
  if(!zorla && h && h.lat===k.lat && h.lon===k.lon && Date.now() - h.t < 30*6e4){ HAVA = h.d; havaYaz(); gokHazirla(); return; }
  fetch("https://api.open-meteo.com/v1/forecast?latitude="+k.lat+"&longitude="+k.lon+"&current=temperature_2m,weather_code,cloud_cover,wind_speed_10m&timezone=auto")
    .then(function(r){ return r.json(); }).then(function(j){
      if(!j || !j.current) return;
      HAVA = { kod:j.current.weather_code, bulut:j.current.cloud_cover, sicak:j.current.temperature_2m, ruzgar:j.current.wind_speed_10m };
      ayar.hava = { t:Date.now(), lat:k.lat, lon:k.lon, d:HAVA }; ayarYaz(); havaYaz(); gokHazirla();
    }).catch(function(){ if(h){ HAVA = h.d; havaYaz(); gokHazirla(); } });
}
function havaDurum(){
  var kod = TEST.hava != null ? +TEST.hava : HAVA ? HAVA.kod : 0, bulut = TEST.bulut != null ? +TEST.bulut : HAVA ? HAVA.bulut : 0;
  if(TEST.hava != null && TEST.bulut == null) bulut = kod >= 45 ? 95 : kod===3 ? 95 : kod===2 ? 55 : kod===1 ? 25 : 0;
  var tur = (kod>=71 && kod<=77) || kod===85 || kod===86 ? "kar" : (kod>=51 && kod<=67) || (kod>=80 && kod<=82) || kod>=95 ? "yagmur" : (kod===45 || kod===48) ? "sis" : "";
  var siddet = [55,57,65,67,75,82,86,99,96].indexOf(kod)>=0 ? 1 : [53,63,73,81,95].indexOf(kod)>=0 ? .65 : .35;
  return { kod:kod, bulut:bulut, tur:tur, siddet:siddet, simsek:kod>=95 };
}
function havaYaz(){
  var e = document.getElementById("havaYazi"); if(!e) return;
  var h = havaDurum(), a = HAVA_AD[h.kod] || ["🌡️",""];
  var gece = gunesYuk(simdiMs(), konum().lat, konum().lon) < -2;
  var em = gece && (h.kod===0 || h.kod===1) ? "🌙" : gece && h.kod===2 ? "☁️" : a[0];
  e.textContent = HAVA || TEST.hava ? em+" "+(HAVA ? Math.round(HAVA.sicak)+"° · " : "")+a[1]+" · "+(konum().istanbul ? "İstanbul" : "Konumun") : "";
}

/* çizim */
function hex(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function karis(a, b, t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
function rgb(c, al){ return "rgba("+Math.round(c[0])+","+Math.round(c[1])+","+Math.round(c[2])+","+(al==null ? 1 : al)+")"; }
var GOK_ANAH = [  // [güneş yüksekliği, üst, orta, ufuk]
  [-90,"#03050f","#070b1f","#0b1026"],[-18,"#04071a","#0a1130","#121a44"],[-11,"#0a1236","#1b2360","#352d6c"],
  [-5,"#18286a","#4e4690","#d27a72"],[-1,"#294790","#9c6d96","#ff9a66"],[3,"#386cb6","#8aa2d2","#ffbe85"],
  [9,"#2c76d0","#68a6e6","#bde0f8"],[25,"#1d68cc","#4d96e0","#a7d5f5"],[90,"#1560c8","#4590dd","#9fd0f5"]];
function gokRenk(alt, aksam){
  for(var i=1;i<GOK_ANAH.length;i++) if(alt <= GOK_ANAH[i][0]){
    var a = GOK_ANAH[i-1], b = GOK_ANAH[i], t = (alt - a[0])/(b[0] - a[0]);
    var r = [karis(hex(a[1]),hex(b[1]),t), karis(hex(a[2]),hex(b[2]),t), karis(hex(a[3]),hex(b[3]),t)];
    if(aksam && alt > -9 && alt < 9){ var s = (1 - Math.abs(alt)/9)*.55; r[2] = karis(r[2], [255,100,70], s); r[1] = karis(r[1], [170,80,130], s*.6); }
    return r;
  }
  return [hex("#1560c8"),hex("#4590dd"),hex("#9fd0f5")];
}
var gc = document.getElementById("yildiz"), gx = gc.getContext("2d"), GW = 0, GH = 0, DPR = 1;
var bulutAnah = "", yildizlar = [], bulutlar = [], damlalar = [], gokDurum = null, simsekT = 0, simsekA = 0, sonKare = 0;
function gokBoyut(){
  bulutAnah = ""; DPR = Math.min(2, devicePixelRatio || 1); GW = innerWidth; GH = innerHeight; gc.width = GW*DPR; gc.height = GH*DPR;
  yildizlar = []; for(var i=0;i<110;i++) yildizlar.push([Math.random()*GW, Math.random()*GH*.75, Math.random()*1.3+.3, Math.random()*6]);
  gokHazirla();
}
function bulutSprite(w, renk, koyu){
  var c = document.createElement("canvas"), h = w*.5; c.width = w; c.height = h; var x = c.getContext("2d");
  var n = 6 + Math.floor(Math.random()*4);
  for(var i=0;i<n;i++){
    var cx = w*(.18 + .64*Math.random()), cy = h*(.45 + .25*Math.random()), r = w*(.12 + .12*Math.random());
    var g = x.createRadialGradient(cx, cy - r*.3, r*.1, cx, cy, r);
    g.addColorStop(0, rgb(renk, .95)); g.addColorStop(.6, rgb(karis(renk, koyu, .35), .7)); g.addColorStop(1, rgb(koyu, 0));
    x.fillStyle = g; x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fill();
  }
  return c;
}
function gokHazirla(){
  if(!GW) return;
  var t = simdiMs(), k = konum(), alt = gunesYuk(t, k.lat, k.lon), h = havaDurum();
  var gun = Math.max(0, Math.min(1, (alt + 6)/14));
  var beyaz = h.tur==="yagmur" ? [190,198,212] : [255,255,255], gecR = [52,60,96], aksR = [255,186,160];
  var renk = alt > 8 ? beyaz : alt > -6 ? karis(aksR, beyaz, Math.max(0, (alt+6)/14)) : karis(gecR, aksR, Math.max(0, (alt+12)/6));
  if(alt <= -12) renk = gecR;
  if(h.tur==="yagmur") renk = karis(renk, [110,118,135], .45);
  var koyu = karis(renk, [40,48,70], .55);
  var n = Math.round(h.bulut/100*10), anah = n+"|"+renk.map(function(c){ return Math.round(c/12); }).join(",")+"|"+GW;
  var dn = h.tur==="yagmur" ? Math.round(80 + 220*h.siddet) : h.tur==="kar" ? Math.round(60 + 140*h.siddet) : 0;
  if(anah !== bulutAnah){ bulutAnah = anah;
  var eski = bulutlar; bulutlar = [];
  for(var i=0;i<n;i++){
    var w = GW*(.45 + Math.random()*.55);
    bulutlar.push({ s:bulutSprite(Math.round(w), renk, koyu), x:eski[i] ? eski[i].x : Math.random()*GW*1.4 - GW*.3, y:GH*(.02 + Math.random()*.42), v:4 + Math.random()*9, a:.55 + .4*(h.bulut/100) });
  }
  }
  if(damlalar.length !== dn){ damlalar = []; for(var j=0;j<dn;j++) damlalar.push([Math.random()*GW, Math.random()*GH, Math.random(), Math.random()*6]); }
  gokDurum = { alt:alt, h:h };
  document.body.classList.toggle("aydin", alt > -8);
}
function gokCiz(zaman){
  requestAnimationFrame(gokCiz);
  if(zaman - sonKare < 30) return;   // ~30 fps, pil dostu
  var dt = Math.min(.1, (zaman - sonKare)/1000); sonKare = zaman;
  if(!gokDurum) return;
  var t = simdiMs(), k = konum(), alt = gokDurum.alt, h = gokDurum.h, b = gunBilgi(t), aksam = t > b.ogle;
  var r = gokRenk(alt, aksam);
  var gri = Math.min(.7, h.bulut/100*.55 + (h.tur ? .18 : 0)), griR = alt > -4 ? [128,138,154] : [24,28,42];
  r = r.map(function(c){ return karis(c, griR, gri); });
  gx.setTransform(DPR,0,0,DPR,0,0);
  var lg = gx.createLinearGradient(0, 0, 0, GH); lg.addColorStop(0, rgb(r[0])); lg.addColorStop(.55, rgb(r[1])); lg.addColorStop(1, rgb(r[2]));
  gx.fillStyle = lg; gx.fillRect(0, 0, GW, GH);
  // yıldızlar
  var ya = Math.max(0, Math.min(1, (-alt - 4)/8)) * (1 - h.bulut/100*.9);
  if(ya > .01){ gx.fillStyle = "#fff"; yildizlar.forEach(function(s){ gx.globalAlpha = ya*(.35 + .35*Math.sin(zaman/900 + s[3])); gx.beginPath(); gx.arc(s[0], s[1], s[2], 0, 7); gx.fill(); }); gx.globalAlpha = 1; }
  var ufuk = GH*.74, tepe = GH*.1, ortu = 1 - .78*Math.min(1, h.bulut/100);
  // güneş
  if(alt > -4){
    var fr = (t - b.dogus)/(b.batis - b.dogus), sx = GW*(.08 + .84*Math.max(-.05, Math.min(1.05, fr))), sy = ufuk - Math.max(-.08, alt/b.max)*(ufuk - tepe);
    var sic = Math.max(0, Math.min(1, alt/20)), cekR = karis([255,140,70], [255,246,220], sic);
    var hl = gx.createRadialGradient(sx, sy, 0, sx, sy, GW*.6);
    hl.addColorStop(0, rgb(cekR, .55*ortu)); hl.addColorStop(.25, rgb(cekR, .18*ortu)); hl.addColorStop(1, rgb(cekR, 0));
    gx.fillStyle = hl; gx.fillRect(0, 0, GW, GH);
    var cr = 26 + 8*(1 - sic), cg = gx.createRadialGradient(sx, sy, 0, sx, sy, cr);
    cg.addColorStop(0, rgb([255,255,245], ortu)); cg.addColorStop(.75, rgb(karis(cekR,[255,255,240],.5), ortu)); cg.addColorStop(1, rgb(cekR, 0));
    gx.fillStyle = cg; gx.beginPath(); gx.arc(sx, sy, cr, 0, 7); gx.fill();
  }
  // ay
  if(alt < -2){
    var dun = gunBilgi(t - 864e5), yarin = gunBilgi(t + 864e5), bas, son;
    if(t < b.dogus){ bas = dun.batis; son = b.dogus; } else { bas = b.batis; son = yarin.dogus; }
    var af = Math.max(0, Math.min(1, (t - bas)/(son - bas))), ax = GW*(.12 + .76*af), ay = ufuk - Math.sin(Math.PI*af)*(ufuk - tepe*1.4);
    var aA = Math.min(1, (-alt - 2)/6) * (1 - .7*Math.min(1, h.bulut/100)), faz = ayEvresi(t), ar = 17;
    var ah = gx.createRadialGradient(ax, ay, 0, ax, ay, 110); ah.addColorStop(0, "rgba(230,235,255,"+(.22*aA*(1 - Math.abs(faz - .5)*1.4))+")"); ah.addColorStop(1, "rgba(230,235,255,0)");
    gx.fillStyle = ah; gx.fillRect(ax - 110, ay - 110, 220, 220);
    gx.globalAlpha = aA; gx.fillStyle = "rgba(200,210,240,.12)"; gx.beginPath(); gx.arc(ax, ay, ar, 0, 7); gx.fill();
    var kk = Math.cos(faz*2*Math.PI), sag = faz < .5;
    gx.fillStyle = "#f3f0e2"; gx.beginPath(); gx.arc(ax, ay, ar, -Math.PI/2, Math.PI/2, !sag);
    gx.ellipse(ax, ay, ar*Math.abs(kk), ar, 0, Math.PI/2, -Math.PI/2, sag ? kk > 0 : kk <= 0); gx.fill(); gx.globalAlpha = 1;
  }
  // bulutlar
  bulutlar.forEach(function(c){ c.x += c.v*dt; if(c.x > GW + 20) c.x = -c.s.width - 20; gx.globalAlpha = c.a; gx.drawImage(c.s, c.x, c.y); });
  gx.globalAlpha = 1;
  // sis
  if(h.tur==="sis"){ for(var f=0; f<3; f++){ var fy = GH*(.35 + f*.2), fg = gx.createLinearGradient(0, fy - 90, 0, fy + 90), fc = alt > -4 ? "230,235,240" : "120,130,150";
    fg.addColorStop(0, "rgba("+fc+",0)"); fg.addColorStop(.5, "rgba("+fc+","+(.28 + .06*Math.sin(zaman/3000 + f))+")"); fg.addColorStop(1, "rgba("+fc+",0)"); gx.fillStyle = fg; gx.fillRect(0, fy - 90, GW, 180); } }
  // yağmur / kar
  if(h.tur==="yagmur"){
    gx.strokeStyle = alt > -4 ? "rgba(225,235,255,.5)" : "rgba(170,185,220,.4)"; gx.lineWidth = 1.1; gx.beginPath();
    damlalar.forEach(function(d){ var v = 650 + 400*d[2], l = 10 + 12*d[2]; d[1] += v*dt; d[0] -= v*dt*.12; if(d[1] > GH){ d[1] = -l; d[0] = Math.random()*GW*1.1; } gx.moveTo(d[0], d[1]); gx.lineTo(d[0] + l*.12, d[1] - l); });
    gx.stroke();
  } else if(h.tur==="kar"){
    gx.fillStyle = "rgba(255,255,255,.85)";
    damlalar.forEach(function(d){ d[1] += (35 + 45*d[2])*dt; d[0] += Math.sin(zaman/1200 + d[3])*.4; if(d[1] > GH){ d[1] = -4; d[0] = Math.random()*GW; } gx.beginPath(); gx.arc(d[0], d[1], 1.2 + 2*d[2], 0, 7); gx.fill(); });
  }
  // şimşek
  if(h.simsek){ if(zaman > simsekT){ simsekA = .55; simsekT = zaman + 5000 + Math.random()*11000; } if(simsekA > 0){ gx.fillStyle = "rgba(235,240,255,"+simsekA+")"; gx.fillRect(0, 0, GW, GH); simsekA -= dt*1.8; } }
}
var tema = document.querySelector('meta[name="theme-color"]');
function temaGuncelle(){ if(!gokDurum || !tema) return; var b = gunBilgi(simdiMs()), r = gokRenk(gokDurum.alt, simdiMs() > b.ogle); tema.setAttribute("content", rgb(r[0]).replace(/rgba\((\d+),(\d+),(\d+),1\)/, function(_, a, c, d){ return "#"+[a,c,d].map(function(x){ return (+x).toString(16).padStart(2,"0"); }).join(""); })); }
addEventListener("resize", gokBoyut);
gokBoyut(); requestAnimationFrame(gokCiz);
setInterval(function(){ gokHazirla(); havaYaz(); temaGuncelle(); }, 60000);
document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="visible"){ havaGetir(); gokHazirla(); havaYaz(); } });
havaGetir(); havaYaz(); temaGuncelle();
copTemizle();
</script>
