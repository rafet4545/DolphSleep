#cubuk{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:8;display:grid;grid-template-columns:repeat(3,88px);padding:6px;border-radius:999px;isolation:isolate;touch-action:none;user-select:none;-webkit-user-select:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.12),inset 1px 0 0 rgba(255,255,255,.12),inset -1px 0 0 rgba(255,255,255,.12),0 10px 30px rgba(0,0,0,.28);transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
#cubuk::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-2;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.02) 50%,rgba(255,255,255,.06));
  -webkit-backdrop-filter:blur(5px) saturate(180%) brightness(1.05);backdrop-filter:blur(5px) saturate(180%) brightness(1.05)}
#cubuk::before{content:"";position:absolute;inset:1px 16% auto;height:42%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0));pointer-events:none;z-index:-1}

var veri = oku();
var ayar = (function(){ try{ return JSON.parse(localStorage.getItem(AYAR_KEY)) || {}; }catch(e){ return {}; } })();
function ayarYaz(){ try{ localStorage.setItem(AYAR_KEY, JSON.stringify(ayar)); }catch(e){} }
function yaz(bulutaDa){ try{ localStorage.setItem(KEY, JSON.stringify(veri)); }catch(e){} if(bulutaDa !== false) bulutYukleSonra(); }

/* ---------- yardımcılar ---------- */
function pad(n){ return (n<10?"0":"")+n; }
function hm(ts){ var d = new Date(ts); return pad(d.getHours())+":"+pad(d.getMinutes()); }
function dk(ts){ var d = new Date(ts); return d.getHours()*60 + d.getMinutes(); }
function geceDk(ts){ var m = dk(ts); return m < 12*60 ? m + 1440 : m; }
function sureYaz(m){ m = Math.max(0, Math.round(m)); var h = Math.floor(m/60); return h ? h+" sa "+pad(m%60)+" dk" : (m%60)+" dk"; }
var GUN = ["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"], AY = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
function gunEt(ts){ var d = new Date(ts); return GUN[d.getDay()]+" "+d.getDate()+" "+AY[d.getMonth()]; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]; }); }
var toastZ = 0;
function toast(m){ var t = document.getElementById("toast"); t.textContent = m; t.classList.add("gor"); clearTimeout(toastZ); toastZ = setTimeout(function(){ t.classList.remove("gor"); }, 2600); }

function degerlendir(g){
  var y = geceDk(g.y), k = dk(g.k), s = (g.k - g.y)/60000;
  var yat = y < HEDEF.yatBas ? "er" : y <= HEDEF.yatSon ? "ok" : "no";
  var kalk = Math.abs(k - HEDEF.kalk) <= HEDEF.kalkTol ? "ok" : k < HEDEF.kalk ? "er" : "no";
  return { yat:yat, kalk:kalk, sure:s, tam: yat!=="no" && kalk!=="no" };
}
function aktifGeceler(l){ return (l || veri.geceler).filter(function(g){ return !g.cop; }); }
function sirali(){ return aktifGeceler().slice().sort(function(a,b){ return b.y-a.y; }); }
function sekMi(g){ if(g.sek != null) return !!g.sek; var m = dk(g.y); return m >= 11*60 && m < 20*60 && (g.k - g.y) <= 4*36e5; }
function gercekGeceler(l){ return aktifGeceler(l).filter(function(g){ return !sekMi(g); }); }
function sonGeceler(n){ return sirali().filter(function(g){ return !sekMi(g); }).slice(0, n); }
function sd(a){ if(a.length<2) return 0; var o = a.reduce(function(x,y){return x+y;},0)/a.length; return Math.sqrt(a.reduce(function(x,y){return x+(y-o)*(y-o);},0)/a.length); }

/* ---------- çizim ---------- */
function ciz(){
  var simdi = Date.now();
  hedefUygula(); var hs = document.getElementById("hedefSatir"); if(hs) hs.innerHTML = 'Hedef: <b>'+hedefYazi()+'</b> arası yat · <b>'+saatYaz(HEDEF.kalk)+'</b>\'da kalk';
  document.getElementById("tarih").textContent = gunEt(simdi);
  var b = document.getElementById("buyuk");
  if(veri.aktif){
    b.classList.add("uyanik"); document.getElementById("buyukE").textContent = "☀️"; document.getElementById("buyukY").textContent = "Uyandım";
    document.getElementById("durum").textContent = hm(veri.aktif)+"'den beri uyuyorsun · "+sureYaz((simdi-veri.aktif)/60000);
  } else {
    b.classList.remove("uyanik"); document.getElementById("buyukE").textContent = "🌙"; document.getElementById("buyukY").textContent = "Uyuyorum";
    var m = dk(simdi), mm = m < 12*60 ? m + 1440 : m, kal = HEDEF.yatSon - mm, gecti = kal <= 0 && (m >= 18*60 || m < 5*60);
    document.getElementById("durum").textContent = (m >= 18*60 || m < 5*60) && kal > 0 && kal <= 6*60 ? "Yatmaya "+sureYaz(kal)+" kaldı" : gecti ? "Hedef saati geçti, hemen yat 😴" : "İyi günler ☀️";
  }
  uyariCiz(); istatCiz(); grafCiz(); listeCiz(); hesapCiz();
}
function uyariCiz(){
  var k = document.getElementById("uyariKutu"), simdi = Date.now(), m = dk(simdi), h = "";
  if(veri.aktif && simdi - veri.aktif > 16*36e5){
    h = '<div class="uyari"><span>⏰</span><div><b>Uyandım\'a basmayı unuttun</b>'+gunEt(veri.aktif)+' '+hm(veri.aktif)+'\'den beri açık.</div><button class="kucuk" id="uyFix">Düzelt</button></div>';
  } else if(!veri.aktif && m >= 5*60 && m < 15*60){
    var bugun = new Date(); bugun.setHours(0,0,0,0);
    var var_ = gercekGeceler().some(function(g){ return g.k >= bugun.getTime(); });
    var dun = (ayar.unuttumGec || "") === bugun.toDateString();
    if(!var_ && !dun) h = '<div class="uyari"><span>🌙</span><div><b>Dün gece butona basmadın</b>Kaçta yattın, kaçta kalktın?</div><button class="kucuk" id="uyEkle">Ekle</button></div>';
  }
  k.innerHTML = h;
  var f = document.getElementById("uyFix"); if(f) f.onclick = function(){ var d = new Date(veri.aktif + 8*36e5); duzenle(null, { y:veri.aktif, k:d.getTime(), aktifKapat:true }); };
  var e = document.getElementById("uyEkle"); if(e) e.onclick = function(){ duzenle(null); };
}
function istatHesap(geceler){
  var sekler = geceler.filter(sekMi); geceler = geceler.filter(function(g){ return !sekMi(g); });
  function sekDk(g){ var gun = isoGun(g.k); return sekler.filter(function(s){ return isoGun(s.y) === gun; }).reduce(function(t,s){ return t + (s.k - s.y)/60000; }, 0); }
  var l = geceler.slice().sort(function(a,b){ return b.y-a.y; }), l7 = l.slice(0, 7);
  if(!l7.length) return null;
  var d = l7.map(degerlendir), ort = d.reduce(function(x,y){return x+y.sure;},0)/d.length;
  var borc = d.reduce(function(x,y,i){ return x + Math.max(0, HEDEF.sure - y.sure - sekDk(l7[i])); },0);
  var duzen = l7.length > 1 ? Math.max(0, Math.round(100 - (sd(l7.map(function(g){return geceDk(g.y);})) + sd(l7.map(function(g){return dk(g.k);})))/2 * 1.4)) : null;
  var seri = 0; for(var i=0;i<l.length;i++){ if(degerlendir(l[i]).tam) seri++; else break; }
  var ortYat = Math.round(l7.reduce(function(x,g){ return x + geceDk(g.y); },0)/l7.length);
  return { ort:ort, borc:borc, duzen:duzen, seri:seri, hedefte:d.filter(function(x){return x.tam;}).length, n:d.length, ortYat:ortYat };
}
function saatYaz(m){ m = ((Math.round(m) % 1440) + 1440) % 1440; return pad(Math.floor(m/60))+":"+pad(m%60); }
function haftaBas(ts){ var d = new Date(ts || Date.now()); d.setHours(0,0,0,0); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return d; }
function haftaKod(ts){ var d = haftaBas(ts); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
/* haftalık puan: hedefe tam uyulan gece +10, sadece yatış zamanında +5, seri devam ediyorsa +5; haftada en az 3 gece varsa düzen bonusu (düzen/10) */
function haftaPuan(geceler){
  var bas = haftaBas().getTime(), tum = geceler.filter(function(g){ return !sekMi(g); }).sort(function(a,b){ return a.y-b.y; }), seri = 0, puan = 0, bu = [];
  tum.forEach(function(g){ var d = degerlendir(g); seri = d.tam ? seri+1 : 0; if(g.k >= bas){ bu.push(g); puan += d.tam ? 10 : (d.yat!=="no" ? 5 : 0); if(d.tam && seri > 1) puan += 5; } });
  if(bu.length >= 3){ var h = istatHesap(bu); if(h && h.duzen!=null) puan += Math.round(h.duzen/10); }
  return { puan:puan, gece:bu.length };
}
function istatCiz(){
  var l = sonGeceler(7), k = document.getElementById("istat");
  if(!l.length){ k.innerHTML = '<div class="bos" style="grid-column:1/-1">Henüz kayıt yok. Bu gece 🌙 butonuna bas.</div>'; return; }
  var h = istatHesap(aktifGeceler()), ort = h.ort, borc = h.borc, duzen = h.duzen || 0, seri = h.seri, hedefte = h.hedefte, d = { length:h.n };
  k.innerHTML =
    (function(){ var sg = sonGece(); if(!sg) return ist("—", "son gece", "");
      var m = sg.dk; return ist(sureYaz(m), sg.ad, m>=450?"iyi":m>=390?"orta":"kotu"); })()+
    ist(l.length>1 ? duzen+"/100" : "—", "düzen puanı", l.length<2?"":duzen>=75?"iyi":duzen>=50?"orta":"kotu")+
    ist(borc ? "−"+sureYaz(borc) : "Yok 🎉", "uyku borcu", borc<=60?"iyi":borc<=240?"orta":"kotu")+
    ist(seri+" 🔥", "seri · "+hedefte+"/"+d.length+" gece hedefte", seri>=3?"iyi":seri>=1?"orta":"kotu");
}
/* son gece: en son uyanılan gecenin uykusu (gece bölünmüşse parçalar toplanır, şekerlemeler hariç) */
function sonGece(){
  var l = gercekGeceler().filter(function(g){ return g.k; }).sort(function(a,b){ return b.k - a.k; }); if(!l.length) return null;
  var u = new Date(l[0].k); u.setHours(0,0,0,0); var bas = u.getTime() - 6*36e5, son = u.getTime() + 16*36e5;   // önceki gün 18:00 – o gün 16:00
  var top = l.filter(function(g){ return g.k > bas && g.k <= son; }).reduce(function(t,g){ return t + (g.k - g.y)/60000; }, 0);
  var bugun = new Date(); bugun.setHours(0,0,0,0), fark = Math.round((bugun - u)/864e5);
  var ad = fark===0 ? "dün gece uyudun" : fark===1 ? "önceki gece uyudun" : u.getDate()+" "+AY[u.getMonth()]+" sabahına kadar";
  return { dk:top, ad:ad };
}
function ist(b, s, c){ return '<div class="ist '+c+'"><b>'+b+'</b><span>'+s+'</span></div>'; }
function grafCiz(){ document.getElementById("graf").innerHTML = grafSvg(sonGeceler(7).reverse()); }
function grafSvg(l){
  if(!l.length) return '<div class="bos">Grafik ilk geceden sonra çıkar.</div>';
  var W = 340, H = 230, sol = 40, ust = 10, alt = 26, bas = Math.min(21*60, Math.floor((HEDEF.yatBas-60)/120)*120), son = Math.max(34*60, Math.ceil((1440+HEDEF.kalk+60)/120)*120);
  var Y = function(m){ return ust + (Math.min(Math.max(m, bas), son)-bas)/(son-bas)*(H-ust-alt); };
  var s = '<svg class="graf" viewBox="0 0 '+W+' '+H+'">';
  s += '<rect x="'+sol+'" y="'+Y(HEDEF.yatBas)+'" width="'+(W-sol)+'" height="'+(Y(HEDEF.yatSon)-Y(HEDEF.yatBas))+'" fill="rgba(255,217,138,.3)"/>';
  s += '<rect x="'+sol+'" y="'+Y(1440+HEDEF.kalk-HEDEF.kalkTol)+'" width="'+(W-sol)+'" height="'+(Y(1440+HEDEF.kalk+HEDEF.kalkTol)-Y(1440+HEDEF.kalk-HEDEF.kalkTol))+'" fill="rgba(255,217,138,.3)"/>';
  for(var h=bas/60; h<=son/60; h+=2){ var y = Y(h*60); s += '<line x1="'+sol+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="rgba(255,255,255,.07)"/><text x="'+(sol-6)+'" y="'+(y+4)+'" fill="#9aa3c7" font-size="10" text-anchor="end">'+pad(h%24)+':00</text>'; }
  var gw = (W-sol)/7;
  l.forEach(function(g, i){
    var d = degerlendir(g), x = sol + i*gw + gw*.22, w = gw*.56, y1 = Y(geceDk(g.y)), km = dk(g.k), y2 = Y(km < 12*60 ? km+1440 : km);
    var renk = d.tam ? "#4fe0a0" : (d.yat==="no" && d.kalk==="no") ? "#ff6b7f" : "#ffc857";
    s += '<rect x="'+x+'" y="'+y1+'" width="'+w+'" height="'+Math.max(4,y2-y1)+'" rx="'+(w/2)+'" fill="'+renk+'" opacity=".85"/>';
    s += '<text x="'+(x+w/2)+'" y="'+(H-8)+'" fill="#9aa3c7" font-size="10" text-anchor="middle">'+GUN[new Date(g.k).getDay()]+'</text>';
  });
  return s + '</svg>';
}
function listeCiz(){
  var l = sirali().slice(0, 30), k = document.getElementById("liste");
  if(!l.length){ k.innerHTML = '<div class="bos">Kayıt yok.</div>'; return; }
  var yuz = ["","😫","😕","😐","🙂","😄"], uy = ["Hiç uyanmadım","1–2 kez uyandım","Çok uyandım"];
  k.innerHTML = l.map(function(g){
    var d = degerlendir(g);
    if(sekMi(g)) return '<div class="gece sek"><div class="g"><b>'+gunEt(g.y).split(" ").slice(1).join(" ")+'</b>'+GUN[new Date(g.y).getDay()]+'</div><div class="s">'+hm(g.y)+' → '+hm(g.k)+' · '+sureYaz(d.sure)+'<small>Uyku borcundan düşüldü</small></div><span class="etk">😴 şekerleme</span><button data-d="'+esc(g.id)+'" aria-label="Düzenle">✎</button></div>';
    var yat = d.yat==="ok" ? '<span class="etk ok">✅ zamanında</span>' : d.yat==="er" ? '<span class="etk er">⏰ erken</span>' : '<span class="etk no">❌ geç yattın</span>';
    return '<div class="gece"><div class="g"><b>'+gunEt(g.k).split(" ").slice(1).join(" ")+'</b>'+GUN[new Date(g.k).getDay()]+'</div>'+
      '<div class="s">'+hm(g.y)+' → '+hm(g.k)+' · '+sureYaz(d.sure)+'<small>'+(g.p?yuz[g.p]+" ":"")+(g.u!=null?uy[g.u]:"")+'</small></div>'+yat+
      '<button data-d="'+esc(g.id)+'" aria-label="Düzenle">✎</button></div>';
  }).join("");
  k.querySelectorAll("[data-d]").forEach(function(b){ b.onclick = function(){ duzenle(b.getAttribute("data-d")); }; });
}

/* ---------- akış ---------- */
var perde = document.getElementById("perde"), sayfa = document.getElementById("sayfa");
var perdeSabit = false;
function kapat(){ perde.classList.remove("ac"); perdeSabit = false; if(window.geriYigin) geriYigin.length = 0; }
function ac(){ perde.classList.add("ac"); if(window.guardGuncelle) guardGuncelle(); }
perde.onclick = function(e){ if(e.target===perde && !perdeSabit) kapat(); };
document.getElementById("buyuk").onclick = function(){
  if(!veri.aktif){ veri.aktif = Date.now(); veri.aktifT = Date.now(); yaz(); ciz(); try{ navigator.vibrate && navigator.vibrate(40); }catch(e){} iyiGeceler(); return; }
  sabahSor({ y:veri.aktif, k:Date.now() }, true);
};
function iyiGeceler(){
  var gm = dk(veri.aktif);
  if(gm >= 11*60 && gm < 20*60){ sayfa.innerHTML = '<div class="sonuc"><div class="b">😴</div><h3>İyi şekerlemeler</h3><p>'+hm(veri.aktif)+' · Şekerleme olarak kaydedilecek, gece hedefini bozmaz. Kalkınca ☀️ butonuna bas.</p></div><button class="ana" id="tm">Tamam</button>'; ac(); document.getElementById("tm").onclick = kapat; return; }
  var m = geceDk(veri.aktif), mesaj = m < HEDEF.yatBas ? "Erkencisin bu gece 👏" : m <= HEDEF.yatSon ? "Tam hedefte! ✅" : "Biraz geç oldu ama yarın düzeltiriz 🙂";
  sayfa.innerHTML = '<div class="sonuc"><div class="b">🌙</div><h3>İyi geceler</h3><p>'+hm(veri.aktif)+' · '+mesaj+'<br>Telefonu bırak, sabah ☀️ butonuna basmayı unutma.</p></div><button class="ana" id="tm">Tamam</button>';
  ac(); document.getElementById("tm").onclick = kapat;
}
function sabahSor(g, yeni, aktifKapat){
  var p = g.p || 0, u = g.u!=null ? g.u : null;
  function c(){
    sayfa.innerHTML = '<h3>'+(sekMi(g) ? '😴 Şekerleme bitti' : '☀️ Günaydın!')+'</h3><p>'+hm(g.y)+' → '+hm(g.k)+' · '+sureYaz((g.k-g.y)/60000)+'</p>'+
      '<p style="margin-bottom:8px;color:var(--yazi)">Nasıl uyudun?</p><div class="sec" id="sp">'+["😫","😕","😐","🙂","😄"].map(function(e,i){ return '<button data-v="'+(i+1)+'" class="'+(p===i+1?"on":"")+'">'+e+'</button>'; }).join("")+'</div>'+
      '<p style="margin-bottom:8px;color:var(--yazi)">Gece uyandın mı?</p><div class="sec yazi" id="su">'+["Hayır","1–2 kez","Çok"].map(function(e,i){ return '<button data-v="'+i+'" class="'+(u===i?"on":"")+'">'+e+'</button>'; }).join("")+'</div>'+
      '<button class="ana" id="kaydet" '+(p&&u!=null?"":"disabled")+'>Kaydet</button>';
    sayfa.querySelectorAll("#sp button").forEach(function(b){ b.onclick = function(){ p = +b.getAttribute("data-v"); c(); }; });
    sayfa.querySelectorAll("#su button").forEach(function(b){ b.onclick = function(){ u = +b.getAttribute("data-v"); c(); }; });
    document.getElementById("kaydet").onclick = function(){
      g.p = p; g.u = u; g.t = Date.now();
      if(yeni){ g.id = g.id || ("g"+g.y); veri.geceler = veri.geceler.filter(function(x){ return x.id !== g.id; }); veri.geceler.push(g); }
      if(yeni && veri.aktif && (aktifKapat || veri.aktif === g.y)){ veri.aktif = null; veri.aktifT = Date.now(); }
      yaz(); ciz(); sonucGoster(g);
    };
  }
  c(); ac();
}
function sonucGoster(g){
  var d = degerlendir(g);
  if(sekMi(g)){ var h = istatHesap(gercekGeceler().concat(aktifGeceler().filter(sekMi)));
    sayfa.innerHTML = '<div class="sonuc"><div class="b">😴</div><h3>'+sureYaz(d.sure)+' şekerleme</h3><p>Uyku borcundan düşüldü'+(h ? ' · kalan borç: '+(h.borc ? sureYaz(h.borc) : 'yok 🎉') : '')+'</p></div><button class="ana" id="tm">Harika</button>';
    document.getElementById("tm").onclick = kapat; return; }
  var b = d.tam ? "🏆" : d.yat==="no" ? "🦉" : "☕";
  var m = d.tam ? "Mükemmel gece! Hedefe tam uydun." : d.yat==="no" ? "Geç yattın. Bu akşam 23:30'u kaçırma." : "Kalkış saatin kaçtı. Yarın 07:30'u dene.";
  sayfa.innerHTML = '<div class="sonuc"><div class="b">'+b+'</div><h3>'+sureYaz(d.sure)+' uyudun</h3><p>'+m+'</p></div><button class="ana aiBtn" id="ruyaGec">💭 Rüya gördün mü? Kaydet</button><button class="ikinci" id="tm">Sonra</button>';
  document.getElementById("ruyaGec").onclick = function(){ kapat(); ruyaBaslat(isoGun(g.k)); };
  document.getElementById("tm").onclick = kapat;
}
function tsYap(tarih, saat){ var p = tarih.split("-"), s = saat.split(":"); return new Date(+p[0], +p[1]-1, +p[2], +s[0], +s[1]).getTime(); }
function isoGun(ts){ var d = new Date(ts); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function duzenle(id, onDeger){
  var g = id ? veri.geceler.filter(function(x){ return x.id===id; })[0] : null, simdi = Date.now();
  var o = onDeger || {}, dunAksam = new Date(); dunAksam.setDate(dunAksam.getDate()-1); dunAksam.setHours(23,15,0,0);
  var y0 = g ? g.y : (o.y || dunAksam.getTime()), k0 = g ? g.k : (o.k || (function(){ var d = new Date(); d.setHours(7,30,0,0); return d.getTime(); })());
  sayfa.innerHTML = '<h3>'+(g ? (sekMi(g) ? "Şekerlemeyi düzenle" : "Geceyi düzenle") : o.aktifKapat ? "Ne zaman uyandın?" : o.sek ? "😴 Şekerleme ekle" : "Unuttuğun geceyi ekle")+'</h3><p>Butona basmayı unuttuysan saatleri buradan gir.</p>'+
    '<div class="alan"><label>Yattığın gün<input type="date" id="yg" value="'+isoGun(y0)+'"></label><label>Saat<input type="time" id="ys" value="'+hm(y0)+'"></label>'+
    '<label>Kalktığın gün<input type="date" id="kg" value="'+isoGun(k0)+'"></label><label>Saat<input type="time" id="ks" value="'+hm(k0)+'"></label></div>'+
    '<div class="satir" style="border:0;padding:4px 0 12px"><div class="yz">😴 Bu bir şekerleme<small>Gündüz uykusu: uyku borcundan düşer, gece hedefini bozmaz</small></div><button type="button" class="dugme'+((g ? sekMi(g) : (o.sek || false)) ? ' on' : '')+'" id="sekDug" aria-label="Şekerleme"></button></div>'+
    '<button class="ana" id="ileri">Devam</button>'+
    (g ? '<button class="ikinci" id="sil" style="color:var(--kirmizi)">Bu geceyi sil</button>' : '')+
    (!g && !o.aktifKapat && !o.sek && dk(simdi) >= 5*60 && dk(simdi) < 15*60 ? '<button class="ikinci" id="gec">Dün gece kayıt tutmayayım</button>' : '');
  ac();
  var v = function(i){ return document.getElementById(i).value; };
  document.getElementById("sekDug").onclick = function(){ this.classList.toggle("on"); };
  document.getElementById("ileri").onclick = function(){
    var y = tsYap(v("yg"), v("ys")), k = tsYap(v("kg"), v("ks"));
    if(!(k > y) || k - y > 16*36e5){ toast("Saatleri kontrol et: kalkış yatıştan sonra olmalı."); return; }

  var p = kilitli() ? sifrele(KRIPTO.key, obj).then(function(e){ return { id:id, gun:gun, t:t, enc:e }; }) : Promise.resolve({ id:id, gun:gun, t:t, acik:obj });
  return p.then(function(k){ R.kayit[id] = k; rAcik[id] = obj; rAcikT[id] = t; rYaz(); rBulutaYaz(k); return id; });
}
function ruyaSil(id){ var k = { id:id, gun:(R.kayit[id] || {}).gun || "", t:Date.now(), sil:true }; R.kayit[id] = k; delete rAcik[id]; rYaz(); rBulutaYaz(k); }

/* ---------- gün verisi ---------- */
var G = null;
function gKey(){ return "dolphsleep.gun."+uidAnahtar(); }
function gOku(){ var x = null; try{ x = JSON.parse(localStorage.getItem(gKey())); }catch(e){} G = (x && x.gunler) ? x : { gunler:{} }; if(!G.bekleyen) G.bekleyen = {}; G._uid = uidAnahtar(); return G; }
function gYaz(){ try{ localStorage.setItem(gKey(), JSON.stringify(G)); }catch(e){} }
function gHazir(){ if(!G || G._uid !== uidAnahtar()) gOku(); }
function bosGun(){ return { anlar:[], kayitlar:[], sil:{}, kapanis:null, t:0 }; }
function gunDoc(k){ return G.gunler[k] || bosGun(); }
function gunBirlestir(a, b){
  a = a || bosGun(); b = b || bosGun();
  var sil = Object.assign({}, a.sil || {}); Object.keys(b.sil || {}).forEach(function(k){ sil[k] = Math.max(sil[k] || 0, b.sil[k]); });
  function bir(l1, l2){ var m = {}; (l1 || []).concat(l2 || []).forEach(function(x){ if(x && x.id && (!m[x.id] || (x.d||0) > (m[x.id].d||0))) m[x.id] = x; });
    return Object.keys(m).map(function(k){ return m[k]; }).filter(function(x){ return !(sil[x.id] && sil[x.id] >= (x.d||0)); }).sort(function(x,y){ return x.t - y.t; }); }
  var anlar = bir(a.anlar, b.anlar), kayitlar = bir(a.kayitlar, b.kayitlar);
  var ka = a.kapanis, kb = b.kapanis, kap = !ka ? kb : !kb ? ka : ((kb.d||0) > (ka.d||0) ? kb : ka);
  return { anlar:anlar, kayitlar:kayitlar, sil:sil, kapanis:kap || null, t:Math.max(a.t||0, b.t||0) };
}
function gunGuncelle(k, f){ var d = temiz(gunDoc(k)); f(d); d.t = Date.now(); delete d.b; G.gunler[k] = d; gYaz(); gBulutaYaz(k); }

/* ---------- bulut (dolphsleep/{uid}/ruyalar, /gunler, /ozel/kilit) ---------- */
function altRef(kol, id){ return FBS.F.doc(FBS.db, "dolphsleep", kullanici.uid, kol, id); }
function altKol(kol){ return FBS.F.collection(FBS.db, "dolphsleep", kullanici.uid, kol); }
function ozelHata(e){ ozelDurum = /permission/.test((e && e.code) || "") ? "izin" : "hata"; bulutUyariCiz(); if(aktifSekme===S_RUYA) ruyaCiz(); if(aktifSekme===S_GUN) gunCiz(); }
function bsiz(o){ var c = temiz(o); delete c.b; return c; }
function bulutUyariCiz(){
  var k = document.getElementById("bulutUyari"); if(!k) return;
  var sorun = kullanici && (ozelDurum === "izin" || bulutDurum === "izin");
  k.hidden = !sorun;
  if(sorun){ k.innerHTML = '<span>⚠️</span><span>Kayıtların buluta gidemiyor, sadece bu telefonda duruyor. Uygulamayı silme!</span><button id="bulutNasil">Nasıl?</button>';
    document.getElementById("bulutNasil").onclick = function(){
      sayfa.innerHTML = '<h3>☁️ Bulut kuralı eksik</h3><p>Firebase → Firestore → <b>Rules</b> sayfasında var olan <code>dolphsleep</code> kuralının altına şunu ekleyip <b>Publish</b>\'e bas. Sonra uygulamayı kapatıp aç; telefondaki kayıtların otomatik buluta yüklenir.</p><pre style="white-space:pre-wrap;background:rgba(0,0,0,.35);padding:12px;border-radius:12px;font-size:12px;color:#d7dcff">match /dolphsleep/{uid}/{alt=**} {\n  allow read, write: if request.auth != null && request.auth.uid == uid;\n}</pre><button class="ana" id="tm">Tamam</button>';
      ac(); document.getElementById("tm").onclick = kapat; }; }
}
function rBulutaYaz(k){ if(!kullanici || !FBS || ozelDurum==="izin" || hesapSiliniyor) return Promise.resolve(); return FBS.F.setDoc(altRef("ruyalar", k.id), bsiz(k)).then(function(){ var y = R.kayit[k.id]; if(y && y.t === k.t && !y.b){ y.b = 1; rYaz(); if(aktifSekme===S_RUYA && !perde.classList.contains("ac")) ruyaAnaCizSessiz(); } }).catch(ozelHata); }
function kilitBulutaYaz(){ if(!kullanici || !FBS || ozelDurum==="izin" || hesapSiliniyor) return Promise.resolve(); return FBS.F.setDoc(altRef("ozel", "kilit"), temiz(R.kilit || { aktif:false, t:Date.now() })).catch(ozelHata); }
function gBulutaYaz(k){ if(!kullanici || !FBS || ozelDurum==="izin" || hesapSiliniyor) return; var d = G.gunler[k]; if(!d) return; var t = d.t;
  if(kilitli() && !KRIPTO.key) return;   // şifre açık ama kilit kapalı: şifresini girince kilitli gider
  var key = kilitli() ? KRIPTO.key : null;
  (key ? sifrele(key, bsiz(d)).then(function(e){ return { t:t, enc:e }; }) : Promise.resolve(bsiz(d))).then(function(doc){ return FBS.F.setDoc(altRef("gunler", k), doc); }).then(function(){ var y = G.gunler[k]; if(y && y.t === t && !y.b){ y.b = 1; gYaz(); var e = document.getElementById("gunBulut"); if(e && gGun === k){ e.textContent = "☁️ Buluta kaydedildi"; e.className = "bulutIs"; } } }).catch(ozelHata); }
function gunCoz(){   // bulutta şifreli duran günleri aç, telefondakilerle birleştir
  gHazir(); var key = KRIPTO.key; if(!key) return Promise.resolve();
  var ks = Object.keys(G.bekleyen || {});
  return Promise.all(ks.map(function(k){ var b = G.bekleyen[k];
    return coz(key, b.enc).then(function(o){
      var m = gunBirlestir(G.gunler[k], o); if(JSON.stringify(bsiz(m)) === JSON.stringify(bsiz(o))) m.b = 1; G.gunler[k] = m; delete G.bekleyen[k];
    }).catch(function(){}); })).then(function(){
    gYaz(); Object.keys(G.gunler).forEach(function(k){ if(!G.gunler[k].b) gBulutaYaz(k); });
    if(aktifSekme===S_GUN && !perde.classList.contains("ac")) gunCiz();
  });
}
function gunHepsiniYukle(){ Object.keys(G.gunler).forEach(function(k){ delete G.gunler[k].b; }); gYaz(); Object.keys(G.gunler).forEach(gBulutaYaz); }
function ozelSenk(){
  if(!kullanici || !FBS) return;
  rHazir(); gHazir();
  Promise.all([FBS.F.getDocs(altKol("ruyalar")), FBS.F.getDoc(altRef("ozel", "kilit")), FBS.F.getDocs(altKol("gunler"))]).then(function(s){
    ozelDurum = ""; bulutUyariCiz();
    var bulut = {}; s[0].forEach(function(d){ bulut[d.id] = d.data(); });
    Object.keys(bulut).forEach(function(id){ var b = bulut[id], y = R.kayit[id]; if(!y || (b.t||0) > (y.t||0)){ b.b = 1; R.kayit[id] = b; } else if((b.t||0) === (y.t||0)) y.b = 1; });
    Object.keys(R.kayit).forEach(function(id){ var b = bulut[id], y = R.kayit[id]; if(!b || (y.t||0) > (b.t||0)) rBulutaYaz(y); });
    var bk = s[1].exists() ? s[1].data() : null;
    if(bk && (!R.kilit || (bk.t||0) > (R.kilit.t||0))){
      if(!R.kilit || R.kilit.salt !== bk.salt){ KRIPTO.key = null; KRIPTO.ac = false; idbSil(uidAnahtar()); rAcik = {}; rAcikT = {}; }
      R.kilit = bk;
    } else if(R.kilit && (!bk || (R.kilit.t||0) > (bk.t||0))) kilitBulutaYaz();
    if(bk || Object.keys(bulut).length) R.soruldu = true;
    rYaz();
    var gb = {}; s[2].forEach(function(d){ gb[d.id] = d.data(); });
    if(!kilitli()) G.bekleyen = {};
    Object.keys(gb).forEach(function(k){
      var b = gb[k];
      if(b.enc){ if(kilitli()) G.bekleyen[k] = b; return; }   // şifreli: anahtarla açılacak (gunCoz)
      var m = gunBirlestir(G.gunler[k], b); if(JSON.stringify(bsiz(m)) === JSON.stringify(bsiz(b)) && !kilitli()) m.b = 1; G.gunler[k] = m;
    });
    gYaz();
    if(KRIPTO.key) gunCoz(); else Object.keys(G.gunler).forEach(function(k){ if(!G.gunler[k].b) gBulutaYaz(k); });
    ozelYuklendi = true; kapiKontrol();
    if(aktifSekme===S_RUYA) ruyaCiz(); if(aktifSekme===S_GUN) gunCiz();
  }).catch(ozelHata);
}

function kartSar(x, t, w, max){

      if(x.measureText(dene).width > w && sat){ out.push(sat); sat = kel[i]; } else sat = dene;
      if(out.length >= max) break;
    }
    if(out.length >= max) break;
    out.push(sat);
  }
  var tamMi = out.join(" ").replace(/\s/g, "").length >= String(t || "").replace(/\s/g, "").length;
