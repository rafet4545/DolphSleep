<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1026">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DolphSleep">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>DolphSleep</title>
<style>
:root{
  --bg:#0b1026;--bg2:#121a3a;--kart:rgba(255,255,255,.055);--cizgi:rgba(255,255,255,.1);
  --yazi:#eef0ff;--soluk:#9aa3c7;--ay:#ffd98a;--mor:#8d7bff;--yesil:#4fe0a0;--kirmizi:#ff6b7f;--sari:#ffc857;--mavi:#6ab8e4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:radial-gradient(120% 70% at 50% 0%,#1d2660 0%,var(--bg) 60%) fixed,var(--bg);color:var(--yazi);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;height:100vh;height:100dvh;overflow:hidden;overscroll-behavior:none}
.yildiz{position:fixed;inset:0;pointer-events:none;z-index:0}
main{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 6px;max-width:492px;width:100%;margin:0 auto;flex:none}
.logo{display:flex;align-items:center;gap:10px}
.logo img{width:40px;height:40px;border-radius:11px}
header h1{font-size:20px;margin:0;letter-spacing:.2px}
header small{color:var(--soluk);font-size:13px}
.hesapBtn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);border:1px solid var(--cizgi);color:var(--yazi);border-radius:99px;padding:6px 12px 6px 6px;font-size:13px;cursor:pointer;max-width:48%}
.hesapBtn img,.hesapBtn .bos{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.1);font-size:14px}
.hesapBtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saat{font-size:56px;font-weight:800;text-align:center;margin:14px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:1px}
.durum{text-align:center;color:var(--soluk);font-size:15px;min-height:22px}
.buyuk{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:200px;height:200px;margin:22px auto 10px;border-radius:50%;border:0;cursor:pointer;color:#1a1300;font-weight:800;font-size:20px;
  background:radial-gradient(circle at 35% 30%,#fff3cf,var(--ay) 55%,#d9a441);box-shadow:0 0 0 10px rgba(255,217,138,.08),0 0 60px rgba(255,217,138,.35);transition:transform .15s;font-family:inherit}
.buyuk:active{transform:scale(.96)}
.buyuk .e{font-size:54px;line-height:1}
.buyuk.uyanik{color:#fff;background:radial-gradient(circle at 35% 30%,#b9b0ff,var(--mor) 55%,#4a3bc9);box-shadow:0 0 0 10px rgba(141,123,255,.1),0 0 60px rgba(141,123,255,.45);animation:nefes 4s ease-in-out infinite}
@keyframes nefes{50%{box-shadow:0 0 0 18px rgba(141,123,255,.06),0 0 80px rgba(141,123,255,.55)}}
.hedef{text-align:center;color:var(--soluk);font-size:13px;margin-bottom:12px}
.hedef b{color:var(--yazi)}
.uyari{display:flex;align-items:center;gap:10px;background:rgba(255,200,87,.12);border:1px solid rgba(255,200,87,.35);border-radius:16px;padding:12px 14px;margin:10px 0;font-size:14px}
.uyari b{display:block}
.uyari button{margin-left:auto;flex:none}
.kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:20px;padding:16px;margin:14px 0;backdrop-filter:blur(6px)}
.kart h2{font-size:15px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.kart h2 small{color:var(--soluk);font-weight:500;font-size:12px}
.istat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ist{background:rgba(255,255,255,.04);border-radius:14px;padding:12px}
.ist b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.ist span{color:var(--soluk);font-size:12px}
.ist.iyi b{color:var(--yesil)}.ist.kotu b{color:var(--kirmizi)}.ist.orta b{color:var(--sari)}
svg.graf{width:100%;height:auto;display:block}
.gece{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--cizgi)}
.gece:first-child{border-top:0}
.gece .g{width:62px;font-size:13px;color:var(--soluk)}
.gece .g b{display:block;color:var(--yazi);font-size:14px}
.gece .s{flex:1;font-size:14px;font-variant-numeric:tabular-nums}
.gece .s small{display:block;color:var(--soluk);font-size:12px}
.etk{font-size:12px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.07);white-space:nowrap}
.etk.ok{color:var(--yesil)}.etk.no{color:var(--kirmizi)}.etk.er{color:var(--sari)}
.gece button{background:none;border:0;color:var(--soluk);font-size:16px;cursor:pointer;padding:6px}
.kucuk{background:rgba(255,255,255,.07);border:1px solid var(--cizgi);color:var(--yazi);border-radius:12px;padding:10px 14px;font-size:14px;cursor:pointer;font-family:inherit}
.bos{color:var(--soluk);font-size:14px;text-align:center;padding:10px 0}
.alt{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.perde{position:fixed;inset:0;background:rgba(5,8,20,.7);display:none;align-items:flex-end;justify-content:center;z-index:10;backdrop-filter:blur(4px)}
.perde.ac{display:flex}
.sayfa{background:var(--bg2);border:1px solid var(--cizgi);border-radius:24px 24px 0 0;width:100%;max-width:460px;padding:20px 18px calc(22px + env(safe-area-inset-bottom));animation:yuk .25s ease-out;max-height:90vh;overflow:auto}
@keyframes yuk{from{transform:translateY(40px);opacity:0}}
.sayfa h3{margin:0 0 4px;font-size:19px}
.sayfa p{margin:0 0 14px;color:var(--soluk);font-size:14px;line-height:1.45}
.sec{display:flex;gap:8px;margin-bottom:16px}
.sec button{flex:1;padding:12px 4px;border-radius:14px;border:1px solid var(--cizgi);background:rgba(255,255,255,.05);color:var(--yazi);font-size:24px;cursor:pointer;font-family:inherit}
.sec.yazi button{font-size:14px}
.sec button.on{border-color:var(--ay);background:rgba(255,217,138,.15)}
.ana{width:100%;padding:14px;border:0;border-radius:14px;background:var(--ay);color:#1a1300;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}
.ana:disabled{opacity:.4}
.ana.mavi{background:#fff;color:#1f1f1f;display:flex;align-items:center;justify-content:center;gap:10px}
.ikinci{width:100%;margin-top:10px;padding:13px;border-radius:14px;border:1px solid var(--cizgi);background:rgba(255,255,255,.06);color:var(--yazi);font-size:15px;cursor:pointer;font-family:inherit}
.alan{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.alan label{font-size:12px;color:var(--soluk)}
.alan input{width:100%;margin-top:4px;padding:10px;border-radius:12px;border:1px solid var(--cizgi);background:rgba(255,255,255,.06);color:var(--yazi);font-size:15px;color-scheme:dark;font-family:inherit}
.sonuc{text-align:center;padding:6px 0 14px}
.sonuc .b{font-size:40px;font-weight:800}
.satir{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--cizgi)}
.satir:first-of-type{border-top:0}
.satir .yz{flex:1;font-size:15px}.satir .yz small{display:block;color:var(--soluk);font-size:12px;margin-top:2px}
.dugme{width:50px;height:30px;border-radius:99px;border:0;background:rgba(255,255,255,.15);position:relative;cursor:pointer;flex:none}
.dugme::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.dugme.on{background:var(--yesil)}.dugme.on::after{left:23px}
.not{font-size:12px;color:var(--soluk);text-align:center;margin-top:18px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1e2752;border:1px solid var(--cizgi);color:var(--yazi);padding:10px 16px;border-radius:14px;font-size:14px;z-index:20;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.gor{opacity:1}
#giris{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:radial-gradient(120% 70% at 50% 0%,#1d2660 0%,var(--bg) 65%),var(--bg)}
#giris[hidden]{display:none}
#giris [hidden]{display:none!important}
#kurKapi{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:radial-gradient(120% 70% at 50% 0%,#1d2660 0%,var(--bg) 65%),var(--bg)}
#kurKapi[hidden]{display:none}
#kurKapi img{width:110px;height:110px;border-radius:26px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#kurKapi h2{margin:4px 0 0;font-size:24px}#kurKapi p{margin:0;color:var(--soluk);max-width:330px;line-height:1.5}
#kurKapi ol{text-align:left;max-width:330px;margin:4px 0;padding-left:22px;line-height:1.8;font-size:15px}
#kurKapi .ana{max-width:340px}
#kurKapi .sem{display:inline-block;padding:0 6px;border-radius:6px;background:rgba(255,255,255,.12)}
#giris img{width:120px;height:120px;border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#giris h2{margin:6px 0 0;font-size:28px}#giris p{margin:0;color:var(--soluk);max-width:320px;line-height:1.5}
#giris .ana{max-width:340px}
.ustBtn{display:flex;gap:8px}
.lider{display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:14px;margin:4px 0;background:rgba(255,255,255,.04)}
.lider.ben{background:rgba(255,217,138,.13);border:1px solid rgba(255,217,138,.35)}
.lider .sira{width:28px;text-align:center;font-weight:800;font-size:16px}
.lider .ad{flex:1;min-width:0}.lider .ad b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lider .ad small{color:var(--soluk);font-size:12px}
.lider .puan{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.adm{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--cizgi);cursor:pointer}
.adm:first-child{border-top:0}
.adm img,.adm .bos{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.1)}
.adm .yz{flex:1;min-width:0;font-size:14px}.adm .yz b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.adm .yz small{display:block;color:var(--soluk);font-size:12px}
.ozet{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 12px}
.ozet div{background:rgba(255,255,255,.05);border-radius:12px;padding:10px;text-align:center}.ozet b{display:block;font-size:20px}.ozet span{font-size:11px;color:var(--soluk)}
.takmaGir{width:100%;padding:13px;border-radius:14px;border:1px solid var(--cizgi);background:rgba(255,255,255,.06);color:var(--yazi);font-size:16px;margin-bottom:12px;font-family:inherit}
.bulut{font-size:12px;color:var(--soluk);text-align:center;margin-top:6px}
/* ---------- v5: kaydırmalı sekmeler ---------- */
#kaydir{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
#kaydir::-webkit-scrollbar{display:none}
.sekme{flex:0 0 100%;width:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;overflow-x:hidden;padding:0 16px calc(118px + env(safe-area-inset-bottom));overscroll-behavior-y:contain}
.sekme .ic{max-width:460px;margin:0 auto}
.baslikS{font-size:26px;font-weight:800;margin:14px 0 2px;letter-spacing:.2px}
.altS{color:var(--soluk);font-size:14px;margin:0 0 14px}
/* liquid glass sekme çubuğu */
#cubuk{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:8;display:grid;grid-template-columns:repeat(3,88px);padding:6px;border-radius:999px;isolation:isolate;
  background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.04) 55%,rgba(255,255,255,.08));
  -webkit-backdrop-filter:blur(22px) saturate(190%) brightness(1.08);backdrop-filter:blur(22px) saturate(190%) brightness(1.08);
  border:1px solid rgba(255,255,255,.2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(255,255,255,.1),inset 0 0 18px rgba(255,255,255,.05),0 12px 34px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.25)}
#cubuk::before{content:"";position:absolute;inset:1px 18% auto;height:45%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0));pointer-events:none;z-index:-1}
#cubuk button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border:0;background:none;color:rgba(238,240,255,.62);font-family:inherit;cursor:pointer;transition:color .25s,transform .2s}
#cubuk button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
#cubuk button svg .dolu{fill:currentColor;stroke:none}
#cubuk button small{font-size:11px;font-weight:600;letter-spacing:.2px}
#cubuk button.on{color:#fff}
#cubuk button.on svg{transform:scale(1.12)}
#cubuk button:active{transform:scale(.92)}
.lens{position:absolute;top:6px;left:6px;width:88px;bottom:6px;border-radius:999px;z-index:0;pointer-events:none;
  background:radial-gradient(130% 160% at 30% -10%,rgba(255,255,255,.38),rgba(255,255,255,.1) 55%,rgba(141,123,255,.14));
  border:1px solid rgba(255,255,255,.38);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.7),inset 0 -8px 14px rgba(141,123,255,.22),inset 0 0 0 .5px rgba(255,255,255,.2),0 6px 16px rgba(0,0,0,.28);
  transform:translateX(0);will-change:transform}
/* rüyalar */
.kilitEkran{text-align:center;padding:40px 6px 10px}
.kilitEkran .kilitI{width:92px;height:92px;margin:0 auto 14px;border-radius:28px;display:grid;place-items:center;font-size:44px;background:linear-gradient(160deg,rgba(141,123,255,.35),rgba(106,184,228,.15));border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 20px 50px rgba(0,0,0,.35)}
.kilitEkran h3{margin:0 0 6px;font-size:22px}.kilitEkran p{color:var(--soluk);margin:0 0 18px;font-size:14px;line-height:1.5}
.sifreIn{width:100%;padding:14px;border-radius:14px;border:1px solid var(--cizgi);background:rgba(255,255,255,.06);color:var(--yazi);font-size:17px;margin-bottom:10px;font-family:inherit;text-align:center;letter-spacing:2px}
.sifreIn::placeholder{letter-spacing:0}
.ust3{display:flex;gap:8px;margin-bottom:12px}
.ust3 .kucuk{flex:1;padding:12px 8px}
.yeniRuya{width:100%;display:flex;align-items:center;gap:12px;padding:16px;border-radius:20px;border:1px solid rgba(141,123,255,.45);background:linear-gradient(135deg,rgba(141,123,255,.32),rgba(106,184,228,.12));color:var(--yazi);font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;text-align:left;margin-bottom:4px}
.yeniRuya span:first-child{font-size:30px}.yeniRuya small{display:block;font-weight:500;color:var(--soluk);font-size:13px}
.takvimB{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.takvimB button{background:rgba(255,255,255,.07);border:1px solid var(--cizgi);color:var(--yazi);width:36px;height:36px;border-radius:12px;font-size:18px;cursor:pointer}
.takvimB b{font-size:16px;cursor:pointer}
.takvim{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.takvim .gb{font-size:11px;color:var(--soluk);text-align:center;padding-bottom:2px}
.gh{aspect-ratio:1;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid transparent;color:var(--soluk);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;cursor:pointer;font-family:inherit;padding:0;line-height:1.1}
.gh i{font-style:normal;font-size:17px;line-height:1}
.gh.var{background:rgba(141,123,255,.16);color:var(--yazi);border-color:rgba(141,123,255,.35)}
.gh.yok{opacity:.55}
.gh.bugun{border-color:var(--ay)}
.gh.yer{visibility:hidden}
.gh.sec{background:rgba(255,217,138,.2);border-color:var(--ay)}
.yilG{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.yilG button{padding:14px 6px;border-radius:14px;border:1px solid var(--cizgi);background:rgba(255,255,255,.05);color:var(--yazi);font-family:inherit;cursor:pointer;font-size:14px}
.yilG button b{display:block;font-size:20px;margin-top:2px}.yilG button.dolu{border-color:rgba(141,123,255,.45);background:rgba(141,123,255,.13)}
.rk{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:16px;margin:8px 0;background:rgba(255,255,255,.045);border:1px solid var(--cizgi);color:var(--yazi);font-family:inherit;cursor:pointer}
.rk .rkU{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.rk .rkU b{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .rkU small{color:var(--soluk);font-size:12px;flex:none}
.rk p{margin:0;color:var(--soluk);font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.etiketS{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.etiketS span{font-size:11px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.07);color:var(--yazi)}
.puanSec{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}
.puanSec button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px;border-radius:14px;border:1px solid var(--cizgi);background:rgba(255,255,255,.05);color:var(--yazi);font-family:inherit;cursor:pointer}
.puanSec button i{font-style:normal;font-size:26px;line-height:1}.puanSec button small{font-size:10.5px;color:var(--soluk)}
.puanSec button.on{border-color:var(--ay);background:rgba(255,217,138,.15)}.puanSec button.on small{color:var(--yazi)}
.cipler{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.cipler button{padding:8px 12px;border-radius:99px;border:1px solid var(--cizgi);background:rgba(255,255,255,.05);color:var(--yazi);font-family:inherit;font-size:13.5px;cursor:pointer}
.cipler button.on{border-color:var(--mor);background:rgba(141,123,255,.25)}
.etk2{font-size:13px;color:var(--yazi);margin:0 0 8px;font-weight:600}
textarea.yaziAlan{width:100%;min-height:160px;padding:13px;border-radius:14px;border:1px solid var(--cizgi);background:rgba(255,255,255,.06);color:var(--yazi);font-size:16px;line-height:1.5;font-family:inherit;resize:vertical;margin-bottom:12px}
input.baslikIn{width:100%;padding:12px 13px;border-radius:14px;border:1px solid var(--cizgi);background:rgba(255,255,255,.06);color:var(--yazi);font-size:16px;font-weight:700;font-family:inherit;margin-bottom:10px}
.aiBtn{background:linear-gradient(135deg,#a594ff,#6ab8e4)!important;color:#0b1026!important}
.ikiBtn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.ikiBtn .ikinci{margin-top:0}
.ruyaMetin{white-space:pre-wrap;line-height:1.6;font-size:15.5px;color:var(--yazi);margin:10px 0 14px}
.dusun{display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 0;color:var(--soluk);font-size:14px}
.dusun .top{width:64px;height:64px;border-radius:50%;background:conic-gradient(from 0deg,#8d7bff,#6ab8e4,#ffd98a,#8d7bff);animation:don 1.4s linear infinite;-webkit-mask:radial-gradient(circle,transparent 52%,#000 54%);mask:radial-gradient(circle,transparent 52%,#000 54%)}
@keyframes don{to{transform:rotate(360deg)}}
.bilgiK{font-size:12.5px;color:var(--soluk);background:rgba(255,255,255,.04);border:1px dashed var(--cizgi);border-radius:14px;padding:10px 12px;margin:10px 0;line-height:1.45}
/* gün */
.ruhSec{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:4px 0 6px}
.ruhSec button{aspect-ratio:1;border-radius:20px;border:1px solid var(--cizgi);background:rgba(255,255,255,.05);font-size:30px;cursor:pointer;transition:transform .15s}
.ruhSec button:active{transform:scale(.9)}
.ruhSec button.on{border-color:var(--ay);background:rgba(255,217,138,.15)}
.ruhAd{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center;font-size:11px;color:var(--soluk);margin-bottom:6px}
.gunNav{display:flex;align-items:center;justify-content:space-between;margin:10px 0 2px}
.gunNav button{background:rgba(255,255,255,.07);border:1px solid var(--cizgi);color:var(--yazi);width:36px;height:36px;border-radius:12px;font-size:18px;cursor:pointer}
.gunNav button:disabled{opacity:.3}
.gunNav b{font-size:15px}
.an{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--cizgi)}
.an:first-child{border-top:0}
.an .anS{width:46px;flex:none;font-variant-numeric:tabular-nums;color:var(--soluk);font-size:13px;padding-top:3px}
.an .anE{font-size:24px;line-height:1;flex:none}
.an .anN{flex:1;font-size:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.an .anN.bosN{color:var(--soluk)}
.an button{background:none;border:0;color:var(--soluk);font-size:15px;cursor:pointer;padding:4px}
.kapanisK{background:linear-gradient(160deg,rgba(255,217,138,.14),rgba(141,123,255,.1));border:1px solid rgba(255,217,138,.3);border-radius:20px;padding:16px;margin:14px 0}
.kapanisK h4{margin:0 0 6px;font-size:16px}
.kapanisK .ruyaMetin{font-size:14.5px;margin:6px 0 0}
.kapanisK details{margin-top:10px;font-size:13px;color:var(--soluk)}
.kapanBtn{width:100%;padding:15px;border-radius:18px;border:1px solid rgba(255,217,138,.45);background:linear-gradient(135deg,rgba(255,217,138,.28),rgba(141,123,255,.18));color:var(--yazi);font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px}
</style>
</head>
<body>

<main>

    <div class="logo"><img src="icon-192.png" alt=""><div><h1>DolphSleep</h1><small id="tarih"></small></div></div>
    <div class="ustBtn"><button class="hesapBtn" id="liderBtn" style="padding:6px 12px"><span>🏆</span></button><button class="hesapBtn" id="hesapBtn"><span class="bos">👤</span><span>Giriş yap</span></button></div>

<div id="kaydir">
<section class="sekme" id="sekUyku"><div class="ic">

</div></section>

  <button data-i="1"><svg viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 7 9.5 4.25 4.25 0 0 0 7 18Z"/><path d="M18.5 3.5l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6Z" class="dolu"/></svg><small>Rüyalar</small></button>
  <button data-i="2"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg><small>Gün</small></button>

<div id="kurKapi" hidden></div>
<div id="giris"><img src="icon-512.png" alt=""><h2>DolphSleep</h2><p>Uykunu takip et, düzenini gör, arkadaşlarınla yarış 🌙</p>
  <button class="ana mavi" id="girisGoogle"><svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Google ile giriş yap</button>
  <p id="girisDurum" style="font-size:13px"></p></div>
<div class="perde" id="perde"><div class="sayfa" id="sayfa"></div></div>
<div class="toast" id="toast"></div>

<script>
var SURUM = 5;
document.getElementById("surum").textContent = SURUM;
var HEDEF = { yatBas: 23*60, yatSon: 23*60+30, kalk: 7*60+30, kalkTol: 15, sure: 8*60, hatirlat: 22*60+30 };
var KEY = "dolphsleep.v1", AYAR_KEY = "dolphsleep.ayar.v1";

/* ---------- veri ---------- */
function bosVeri(){ return { geceler:[], aktif:null, aktifT:0, silinen:{} }; }
function oku(){ try{ var v = JSON.parse(localStorage.getItem(KEY)); if(v && v.geceler){ v.silinen = v.silinen || {}; v.aktifT = v.aktifT || 0; v.geceler.forEach(function(g){ if(!g.id) g.id = "g"+g.y; if(!g.t) g.t = g.k || Date.now(); }); return v; } }catch(e){} return bosVeri(); }
var veri = oku();
var ayar = (function(){ try{ return JSON.parse(localStorage.getItem(AYAR_KEY)) || {}; }catch(e){ return {}; } })();
function ayarYaz(){ try{ localStorage.setItem(AYAR_KEY, JSON.stringify(ayar)); }catch(e){} }
function yaz(bulutaDa){ try{ localStorage.setItem(KEY, JSON.stringify(veri)); }catch(e){} if(bulutaDa !== false) bulutYukleSonra(); }

/* ---------- yardımcılar ---------- */
function pad(n){ return (n<10?"0":"")+n; }
function hm(ts){ var d = new Date(ts); return pad(d.getHours())+":"+pad(d.getMinutes()); }
function dk(ts){ var d = new Date(ts); return d.getHours()*60 + d.getMinutes(); }
function geceDk(ts){ var m = dk(ts); return m < 12*60 ? m + 1440 : m; }
function sureYaz(m){ m = Math.max(0, Math.round(m)); var h = Math.floor(m/60); return h ? h+" sa "+pad(m%60)+" dk" : (m%60)+" dk"; }
var GUN = ["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"], AY = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
function gunEt(ts){ var d = new Date(ts); return GUN[d.getDay()]+" "+d.getDate()+" "+AY[d.getMonth()]; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]; }); }
var toastZ = 0;
function toast(m){ var t = document.getElementById("toast"); t.textContent = m; t.classList.add("gor"); clearTimeout(toastZ); toastZ = setTimeout(function(){ t.classList.remove("gor"); }, 2600); }

function degerlendir(g){
  var y = geceDk(g.y), k = dk(g.k), s = (g.k - g.y)/60000;
  var yat = y < HEDEF.yatBas ? "er" : y <= HEDEF.yatSon ? "ok" : "no";
  var kalk = Math.abs(k - HEDEF.kalk) <= HEDEF.kalkTol ? "ok" : k < HEDEF.kalk ? "er" : "no";
  return { yat:yat, kalk:kalk, sure:s, tam: yat!=="no" && kalk!=="no" };
}
function sirali(){ return veri.geceler.slice().sort(function(a,b){ return b.y-a.y; }); }
function sonGeceler(n){ return sirali().slice(0, n); }
function sd(a){ if(a.length<2) return 0; var o = a.reduce(function(x,y){return x+y;},0)/a.length; return Math.sqrt(a.reduce(function(x,y){return x+(y-o)*(y-o);},0)/a.length); }

/* ---------- çizim ---------- */
function ciz(){
  var simdi = Date.now();
  document.getElementById("tarih").textContent = gunEt(simdi);
  var b = document.getElementById("buyuk");
  if(veri.aktif){
    b.classList.add("uyanik"); document.getElementById("buyukE").textContent = "☀️"; document.getElementById("buyukY").textContent = "Uyandım";
    document.getElementById("durum").textContent = hm(veri.aktif)+"'den beri uyuyorsun · "+sureYaz((simdi-veri.aktif)/60000);
  } else {
    b.classList.remove("uyanik"); document.getElementById("buyukE").textContent = "🌙"; document.getElementById("buyukY").textContent = "Uyuyorum";
    var m = dk(simdi), kal = HEDEF.yatSon - m;
    document.getElementById("durum").textContent = (m >= 18*60 && kal > 0) ? "Yatmaya "+sureYaz(kal)+" kaldı" : (m >= HEDEF.yatSon || m < 4*60) ? "Hedef saati geçti, hemen yat 😴" : "İyi günler ☀️";
  }
  uyariCiz(); istatCiz(); grafCiz(); listeCiz(); hesapCiz();
}
function uyariCiz(){
  var k = document.getElementById("uyariKutu"), simdi = Date.now(), m = dk(simdi), h = "";
  if(veri.aktif && simdi - veri.aktif > 16*36e5){
    h = '<div class="uyari"><span>⏰</span><div><b>Uyandım\'a basmayı unuttun</b>'+gunEt(veri.aktif)+' '+hm(veri.aktif)+'\'den beri açık.</div><button class="kucuk" id="uyFix">Düzelt</button></div>';
  } else if(!veri.aktif && m >= 5*60 && m < 15*60){
    var bugun = new Date(); bugun.setHours(0,0,0,0);
    var var_ = veri.geceler.some(function(g){ return g.k >= bugun.getTime(); });
    var dun = (ayar.unuttumGec || "") === bugun.toDateString();
    if(!var_ && !dun) h = '<div class="uyari"><span>🌙</span><div><b>Dün gece butona basmadın</b>Kaçta yattın, kaçta kalktın?</div><button class="kucuk" id="uyEkle">Ekle</button></div>';
  }
  k.innerHTML = h;
  var f = document.getElementById("uyFix"); if(f) f.onclick = function(){ var d = new Date(veri.aktif + 8*36e5); duzenle(null, { y:veri.aktif, k:d.getTime(), aktifKapat:true }); };
  var e = document.getElementById("uyEkle"); if(e) e.onclick = function(){ duzenle(null); };
}
function istatHesap(geceler){
  var l = geceler.slice().sort(function(a,b){ return b.y-a.y; }), l7 = l.slice(0, 7);
  if(!l7.length) return null;
  var d = l7.map(degerlendir), ort = d.reduce(function(x,y){return x+y.sure;},0)/d.length;
  var borc = d.reduce(function(x,y){ return x + Math.max(0, HEDEF.sure - y.sure); },0);
  var duzen = l7.length > 1 ? Math.max(0, Math.round(100 - (sd(l7.map(function(g){return geceDk(g.y);})) + sd(l7.map(function(g){return dk(g.k);})))/2 * 1.4)) : null;
  var seri = 0; for(var i=0;i<l.length;i++){ if(degerlendir(l[i]).tam) seri++; else break; }
  var ortYat = Math.round(l7.reduce(function(x,g){ return x + geceDk(g.y); },0)/l7.length);
  return { ort:ort, borc:borc, duzen:duzen, seri:seri, hedefte:d.filter(function(x){return x.tam;}).length, n:d.length, ortYat:ortYat };
}
function saatYaz(m){ m = ((Math.round(m) % 1440) + 1440) % 1440; return pad(Math.floor(m/60))+":"+pad(m%60); }
function haftaBas(ts){ var d = new Date(ts || Date.now()); d.setHours(0,0,0,0); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return d; }
function haftaKod(ts){ var d = haftaBas(ts); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
/* haftalık puan: hedefe tam uyulan gece +10, sadece yatış zamanında +5, seri devam ediyorsa +5; haftada en az 3 gece varsa düzen bonusu (düzen/10) */
function haftaPuan(geceler){
  var bas = haftaBas().getTime(), tum = geceler.slice().sort(function(a,b){ return a.y-b.y; }), seri = 0, puan = 0, bu = [];
  tum.forEach(function(g){ var d = degerlendir(g); seri = d.tam ? seri+1 : 0; if(g.k >= bas){ bu.push(g); puan += d.tam ? 10 : (d.yat!=="no" ? 5 : 0); if(d.tam && seri > 1) puan += 5; } });
  if(bu.length >= 3){ var h = istatHesap(bu); if(h && h.duzen!=null) puan += Math.round(h.duzen/10); }
  return { puan:puan, gece:bu.length };
}
function istatCiz(){
  var l = sonGeceler(7), k = document.getElementById("istat");
  if(!l.length){ k.innerHTML = '<div class="bos" style="grid-column:1/-1">Henüz kayıt yok. Bu gece 🌙 butonuna bas.</div>'; return; }
  var h = istatHesap(veri.geceler), ort = h.ort, borc = h.borc, duzen = h.duzen || 0, seri = h.seri, hedefte = h.hedefte, d = { length:h.n };
  k.innerHTML =
    ist(sureYaz(ort), "ortalama uyku", ort>=450?"iyi":ort>=390?"orta":"kotu")+
    ist(l.length>1 ? duzen+"/100" : "—", "düzen puanı", l.length<2?"":duzen>=75?"iyi":duzen>=50?"orta":"kotu")+
    ist(borc ? "−"+sureYaz(borc) : "Yok 🎉", "uyku borcu", borc<=60?"iyi":borc<=240?"orta":"kotu")+
    ist(seri+" 🔥", "seri · "+hedefte+"/"+d.length+" gece hedefte", seri>=3?"iyi":seri>=1?"orta":"kotu");
}
function ist(b, s, c){ return '<div class="ist '+c+'"><b>'+b+'</b><span>'+s+'</span></div>'; }
function grafCiz(){ document.getElementById("graf").innerHTML = grafSvg(sonGeceler(7).reverse()); }
function grafSvg(l){
  if(!l.length) return '<div class="bos">Grafik ilk geceden sonra çıkar.</div>';
  var W = 340, H = 230, sol = 40, ust = 10, alt = 26, bas = 21*60, son = 34*60;
  var Y = function(m){ return ust + (Math.min(Math.max(m, bas), son)-bas)/(son-bas)*(H-ust-alt); };
  var s = '<svg class="graf" viewBox="0 0 '+W+' '+H+'">';
  s += '<rect x="'+sol+'" y="'+Y(HEDEF.yatBas)+'" width="'+(W-sol)+'" height="'+(Y(HEDEF.yatSon)-Y(HEDEF.yatBas))+'" fill="rgba(255,217,138,.3)"/>';
  s += '<rect x="'+sol+'" y="'+Y(1440+HEDEF.kalk-HEDEF.kalkTol)+'" width="'+(W-sol)+'" height="'+(Y(1440+HEDEF.kalk+HEDEF.kalkTol)-Y(1440+HEDEF.kalk-HEDEF.kalkTol))+'" fill="rgba(255,217,138,.3)"/>';
  for(var h=21; h<=34; h+=2){ var y = Y(h*60); s += '<line x1="'+sol+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="rgba(255,255,255,.07)"/><text x="'+(sol-6)+'" y="'+(y+4)+'" fill="#9aa3c7" font-size="10" text-anchor="end">'+pad(h%24)+':00</text>'; }
  var gw = (W-sol)/7;
  l.forEach(function(g, i){
    var d = degerlendir(g), x = sol + i*gw + gw*.22, w = gw*.56, y1 = Y(geceDk(g.y)), km = dk(g.k), y2 = Y(km < 12*60 ? km+1440 : km);
    var renk = d.tam ? "#4fe0a0" : (d.yat==="no" && d.kalk==="no") ? "#ff6b7f" : "#ffc857";
    s += '<rect x="'+x+'" y="'+y1+'" width="'+w+'" height="'+Math.max(4,y2-y1)+'" rx="'+(w/2)+'" fill="'+renk+'" opacity=".85"/>';
    s += '<text x="'+(x+w/2)+'" y="'+(H-8)+'" fill="#9aa3c7" font-size="10" text-anchor="middle">'+GUN[new Date(g.k).getDay()]+'</text>';
  });
  return s + '</svg>';
}
function listeCiz(){
  var l = sonGeceler(30), k = document.getElementById("liste");
  if(!l.length){ k.innerHTML = '<div class="bos">Kayıt yok.</div>'; return; }
  var yuz = ["","😫","😕","😐","🙂","😄"], uy = ["Hiç uyanmadım","1–2 kez uyandım","Çok uyandım"];
  k.innerHTML = l.map(function(g){
    var d = degerlendir(g);
    var yat = d.yat==="ok" ? '<span class="etk ok">✅ zamanında</span>' : d.yat==="er" ? '<span class="etk er">⏰ erken</span>' : '<span class="etk no">❌ geç yattın</span>';
    return '<div class="gece"><div class="g"><b>'+gunEt(g.k).split(" ").slice(1).join(" ")+'</b>'+GUN[new Date(g.k).getDay()]+'</div>'+
      '<div class="s">'+hm(g.y)+' → '+hm(g.k)+' · '+sureYaz(d.sure)+'<small>'+(g.p?yuz[g.p]+" ":"")+(g.u!=null?uy[g.u]:"")+'</small></div>'+yat+
      '<button data-d="'+esc(g.id)+'" aria-label="Düzenle">✎</button></div>';
  }).join("");
  k.querySelectorAll("[data-d]").forEach(function(b){ b.onclick = function(){ duzenle(b.getAttribute("data-d")); }; });
}

/* ---------- akış ---------- */
var perde = document.getElementById("perde"), sayfa = document.getElementById("sayfa");
var perdeSabit = false;
function kapat(){ perde.classList.remove("ac"); perdeSabit = false; }
function ac(){ perde.classList.add("ac"); }
perde.onclick = function(e){ if(e.target===perde && !perdeSabit) kapat(); };
document.getElementById("buyuk").onclick = function(){
  if(!veri.aktif){ veri.aktif = Date.now(); veri.aktifT = Date.now(); yaz(); ciz(); try{ navigator.vibrate && navigator.vibrate(40); }catch(e){} iyiGeceler(); return; }
  sabahSor({ y:veri.aktif, k:Date.now() }, true);
};
function iyiGeceler(){
  var m = geceDk(veri.aktif), mesaj = m < HEDEF.yatBas ? "Erkencisin bu gece 👏" : m <= HEDEF.yatSon ? "Tam hedefte! ✅" : "Biraz geç oldu ama yarın düzeltiriz 🙂";
  sayfa.innerHTML = '<div class="sonuc"><div class="b">🌙</div><h3>İyi geceler</h3><p>'+hm(veri.aktif)+' · '+mesaj+'<br>Telefonu bırak, sabah ☀️ butonuna basmayı unutma.</p></div><button class="ana" id="tm">Tamam</button>';
  ac(); document.getElementById("tm").onclick = kapat;
}
function sabahSor(g, yeni, aktifKapat){
  var p = g.p || 0, u = g.u!=null ? g.u : null;
  function c(){
    sayfa.innerHTML = '<h3>☀️ Günaydın!</h3><p>'+hm(g.y)+' → '+hm(g.k)+' · '+sureYaz((g.k-g.y)/60000)+'</p>'+
      '<p style="margin-bottom:8px;color:var(--yazi)">Nasıl uyudun?</p><div class="sec" id="sp">'+["😫","😕","😐","🙂","😄"].map(function(e,i){ return '<button data-v="'+(i+1)+'" class="'+(p===i+1?"on":"")+'">'+e+'</button>'; }).join("")+'</div>'+
      '<p style="margin-bottom:8px;color:var(--yazi)">Gece uyandın mı?</p><div class="sec yazi" id="su">'+["Hayır","1–2 kez","Çok"].map(function(e,i){ return '<button data-v="'+i+'" class="'+(u===i?"on":"")+'">'+e+'</button>'; }).join("")+'</div>'+
      '<button class="ana" id="kaydet" '+(p&&u!=null?"":"disabled")+'>Kaydet</button>';
    sayfa.querySelectorAll("#sp button").forEach(function(b){ b.onclick = function(){ p = +b.getAttribute("data-v"); c(); }; });
    sayfa.querySelectorAll("#su button").forEach(function(b){ b.onclick = function(){ u = +b.getAttribute("data-v"); c(); }; });
    document.getElementById("kaydet").onclick = function(){
      g.p = p; g.u = u; g.t = Date.now();
      if(yeni){ g.id = g.id || ("g"+g.y); veri.geceler = veri.geceler.filter(function(x){ return x.id !== g.id; }); veri.geceler.push(g); }
      if(yeni && veri.aktif && (aktifKapat || veri.aktif === g.y)){ veri.aktif = null; veri.aktifT = Date.now(); }
      yaz(); ciz(); sonucGoster(g);
    };
  }
  c(); ac();
}

  return k==="anahtar-yok" ? "Yapay zekâ henüz kurulmadı (Gemini anahtarı eklenmemiş)." : k==="kota" ? "Yapay zekânın kotası doldu, biraz sonra dene." :
    k==="engellendi" ? "Yapay zekâ bu metni işlemedi. Düzenlemeden kaydedebilirsin." : k==="giris" ? "Önce giriş yapmalısın." :
    /fetch|network|Load failed/i.test(k) ? "İnternet yok gibi görünüyor." : "Yapay zekâ şu an cevap vermedi, tekrar dene.";
}

      '<button class="ana" id="rSifreKoy">🔒 Şifre koy</button><button class="ikinci" id="rSifresiz">Şifresiz devam et</button><p style="font-size:12px;margin-top:12px">Sonra istediğin zaman değiştirebilirsin.</p></div>';
    document.getElementById("rSifreKoy").onclick = function(){ sifreKoySayfa(); };

    var inp = document.getElementById("rSif"), btn = document.getElementById("rAc");
    function dene(){

function kilitAc(sifre){
  return anahtarTuret(sifre, R.kilit.salt, R.kilit.iter).then(function(key){
    return coz(key, R.kilit.dog).then(function(o){ if(o !== "dolphsleep-ok") throw new Error("yanlis"); KRIPTO.key = key; });
  });
}
function ruyaAnaCiz(){

    (rGor.sec ? '<div class="bos">Bu güne kayıt yok.</div><button class="ikinci" id="rGuneEkle">＋ Bu güne rüya ekle</button>' : '<div class="bos">Henüz rüya yok. Yarın sabah ilkini yaz 🌙</div>');

  var st = document.getElementById("rSecTemiz"); if(st) st.onclick = function(){ rGor.sec = null; ruyaAnaCiz(); };

function rKartHtml(x){
  if(x.bozuk) return '<div class="rk"><div class="rkU"><span>⚠️</span><b>Açılamadı (eski şifreyle kilitli)</b><small>'+gunKisa(x.gun)+'</small></div></div>';
  if(!x.gordu) return '<button class="rk" data-id="'+x.id+'"><div class="rkU"><span>😶</span><b style="color:var(--soluk);font-weight:500">Rüya görmedim / hatırlamıyorum</b><small>'+gunKisa(x.gun)+'</small></div></button>';
  var p = R_PUAN[(x.puan || 3) - 1];
  return '<button class="rk" data-id="'+x.id+'"><div class="rkU"><span>'+p[0]+'</span><b>'+esc(x.baslik || "İsimsiz rüya")+'</b><small>'+gunKisa(x.gun)+'</small></div>'+
    (x.metin ? '<p>'+esc(x.metin)+'</p>' : '')+
    ((x.etiket || []).length ? '<div class="etiketS">'+x.etiket.map(function(e){ return '<span>'+esc(R_ETAD[e] || e)+'</span>'; }).join("")+'</div>' : '')+'</button>';
}
function takvimHtml(l){
  var sayi = {}; l.forEach(function(x){ (sayi[x.gun] = sayi[x.gun] || []).push(x); });
  if(rGor.yil){
    var h = '<div class="takvimB"><button id="tGeri">‹</button><b id="tBas">'+rGor.y+'</b><button id="tIleri">›</button></div><div class="yilG">';
    for(var m=0;m<12;m++){
      var on = rGor.y+"-"+pad(m+1)+"-", n = Object.keys(sayi).filter(function(k){ return k.indexOf(on)===0; }).reduce(function(t,k){ return t + sayi[k].filter(function(x){ return x.gordu; }).length; }, 0);
      h += '<button data-ay="'+m+'" class="'+(n ? 'dolu' : '')+'">'+AYTAM[m]+'<b>'+(n || '·')+'</b></button>';
    }
    return h + '</div>';
  }
  var ilk = new Date(rGor.y, rGor.m, 1), gs = new Date(rGor.y, rGor.m+1, 0).getDate(), bas = (ilk.getDay()+6)%7, bugun = isoGun(Date.now());
  var h2 = '<div class="takvimB"><button id="tGeri">‹</button><b id="tBas">'+AYTAM[rGor.m]+' '+rGor.y+' ▾</b><button id="tIleri">›</button></div><div class="takvim">'+
    ["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"].map(function(g){ return '<div class="gb">'+g+'</div>'; }).join("");
  for(var i=0;i<bas;i++) h2 += '<div class="gh yer"></div>';
  for(var d=1; d<=gs; d++){
    var k = rGor.y+"-"+pad(rGor.m+1)+"-"+pad(d), x = sayi[k] || [], g = x.filter(function(y){ return y.gordu && !y.bozuk; });
    var em = g.length ? R_PUAN[(g.reduce(function(a,b){ return (b.puan||3) < (a.puan||3) ? b : a; }).puan || 3) - 1][0] : x.length ? '·' : '';
    h2 += '<button class="gh'+(g.length ? ' var' : x.length ? ' yok' : '')+(k===bugun ? ' bugun' : '')+(k===rGor.sec ? ' sec' : '')+'" data-k="'+k+'">'+d+(em ? '<i>'+em+'</i>' : '')+'</button>';
  }
  return h2 + '</div>';
}
function takvimBagla(){
  var t = document.getElementById("rTakvim");
  document.getElementById("tGeri").onclick = function(){ if(rGor.yil) rGor.y--; else { rGor.m--; if(rGor.m<0){ rGor.m = 11; rGor.y--; } } ruyaAnaCiz(); };
  document.getElementById("tIleri").onclick = function(){ if(rGor.yil) rGor.y++; else { rGor.m++; if(rGor.m>11){ rGor.m = 0; rGor.y++; } } ruyaAnaCiz(); };
  document.getElementById("tBas").onclick = function(){ rGor.yil = !rGor.yil; ruyaAnaCiz(); };
  t.querySelectorAll("[data-ay]").forEach(function(b){ b.onclick = function(){ rGor.m = +b.getAttribute("data-ay"); rGor.yil = false; ruyaAnaCiz(); }; });
  t.querySelectorAll(".gh[data-k]").forEach(function(b){ b.onclick = function(){ var k = b.getAttribute("data-k"); rGor.sec = rGor.sec === k ? null : k; ruyaAnaCiz(); }; });
}
function ruyaDetay(id){
  var x = rAcik[id], gun = (R.kayit[id] || {}).gun; if(!x) return;
  if(!x.gordu){
    sayfa.innerHTML = '<h3>😶 Rüya görmedim</h3><p>'+gunUzun(gun)+'</p><button class="ana" id="rDuz">💭 Aslında gördüm, yazayım</button><button class="ikinci" id="rSil" style="color:var(--kirmizi)">Kaydı sil</button><button class="ikinci" id="tm">Kapat</button>';

    '<div class="ruyaMetin">'+(esc(x.metin) || '<span style="color:var(--soluk)">Yazı yok.</span>')+'</div>'+

  ac(); document.getElementById("tm").onclick = kapat;

  sayfa.innerHTML = '<h3>💭 Rüya gördün mü?</h3><p>Hangi gecenin sabahı: <input type="date" id="rGun" value="'+gun+'" style="background:rgba(255,255,255,.07);border:1px solid var(--cizgi);color:var(--yazi);border-radius:10px;padding:6px 8px;color-scheme:dark;font-family:inherit;font-size:14px"></p>'+

  var puan = x.puan || 0, et = (x.etiket || []).slice();
  sayfa.innerHTML = '<h3>'+(x.id && x.gordu ? '✏️ Rüyayı düzenle' : '💭 Rüyanı anlat')+'</h3><p>'+gunUzun(x.gun)+'</p>'+
    '<p class="etk2">Rüyan nasıldı?</p><div class="puanSec" id="fPuan">'+R_PUAN.map(function(p, i){ return '<button data-v="'+(i+1)+'" class="'+(puan===i+1 ? 'on' : '')+'"><i>'+p[0]+'</i><small>'+p[1]+'</small></button>'; }).join("")+'</div>'+
    '<p class="etk2">Nasıl bir rüyaydı? <span style="color:var(--soluk);font-weight:400">(birden fazla seçebilirsin)</span></p><div class="cipler" id="fEt">'+R_ETIKET.map(function(e){ return '<button data-e="'+e[0]+'" class="'+(et.indexOf(e[0])>=0 ? 'on' : '')+'">'+e[1]+'</button>'; }).join("")+'</div>'+
    '<input class="baslikIn" id="fBas" maxlength="80" placeholder="Başlık (isteğe bağlı)" value="'+esc(x.baslik || "")+'">'+
    '<textarea class="yaziAlan" id="fMetin" placeholder="Ne gördün? Aklında kalan her şeyi yaz. Vaktin yoksa birkaç kelime yeter, yapay zekâ özetler.">'+esc(x.metin || "")+'</textarea>'+
    '<button class="ana aiBtn" id="fDuzen">✨ Yapay zekâ ile düzenle</button>'+
    '<div class="ikiBtn"><button class="ikinci" id="fOzet">📝 Kısa notlardan özetle</button><button class="ikinci" id="fKaydet">Düzenlemeden kaydet</button></div>'+
    '<button class="ikinci" id="fVaz" style="border:0;background:none;color:var(--soluk)">Vazgeç</button>';
  ac();
  sayfa.querySelectorAll("#fPuan button").forEach(function(b){ b.onclick = function(){ puan = +b.getAttribute("data-v"); sayfa.querySelectorAll("#fPuan button").forEach(function(c){ c.classList.toggle("on", c===b); }); }; });
  sayfa.querySelectorAll("#fEt button").forEach(function(b){ b.onclick = function(){ var e = b.getAttribute("data-e"), i = et.indexOf(e); if(i>=0) et.splice(i,1); else et.push(e); b.classList.toggle("on", i<0); }; });
  function oku_(){ return { baslik:document.getElementById("fBas").value.trim(), metin:document.getElementById("fMetin").value.trim() }; }
  function bitir(obj){
    obj = Object.assign({ gordu:true, puan:puan, etiket:et }, obj);
    var eskiYok = Object.keys(rAcik).filter(function(id){ return id !== x.id && R.kayit[id] && !R.kayit[id].sil && R.kayit[id].gun === x.gun && rAcik[id] && rAcik[id].gordu === false; });
    eskiYok.forEach(ruyaSil);
    ruyaKaydet(x.id || null, x.gun, obj).then(function(){ kapat(); rGor.y = +x.gun.slice(0,4); rGor.m = +x.gun.slice(5,7) - 1; ruyaCiz(); toast("Rüya kaydedildi 🌙"); });
  }
  function ai(gorev){
    var f = oku_();
    if(!puan){ toast("Önce rüyanı puanla 🙂"); return; }
    if(f.metin.length < 3){ toast("Önce birkaç kelime yaz"); return; }
    var ham = f.metin;
    dusunCiz(gorev==="duzenle" ? "Yapay zekâ rüyanı düzenliyor…" : "Yapay zekâ rüyanı özetliyor…");
    aiIste(gorev, { metin:ham }).then(function(j){ onizle(j, ham, gorev==="duzenle" ? "duzen" : "ozet", gorev); })
      .catch(function(e){ toast(aiHataYazi(e)); ruyaForm(Object.assign({}, x, { puan:puan, etiket:et, baslik:f.baslik, metin:ham })); });
  }
  function onizle(j, ham, mod, gorev){
    sayfa.innerHTML = '<h3>'+(mod==="duzen" ? '✨ Düzenlenmiş hali' : '📝 Özet')+'</h3><p>İstersen değiştir, sonra kaydet.</p>'+

      '<textarea class="yaziAlan" id="oMetin" style="min-height:220px">'+esc(j.metin)+'</textarea>'+

    document.getElementById("oKaydet").onclick = function(){ bitir({ baslik:document.getElementById("oBas").value.trim(), metin:document.getElementById("oMetin").value.trim(), ham:ham, mod:mod }); };
    document.getElementById("oTekrar").onclick = function(){
      dusunCiz("Tekrar deniyor…");
      aiIste(gorev, { metin:ham }).then(function(j2){ onizle(j2, ham, mod, gorev); }).catch(function(e){ toast(aiHataYazi(e)); onizle(j, ham, mod, gorev); });
    };
    document.getElementById("oGeri").onclick = function(){ ruyaForm(Object.assign({}, x, { puan:puan, etiket:et, baslik:oku_baslik, metin:ham })); };
  }
  var oku_baslik = "";
  document.getElementById("fDuzen").onclick = function(){ oku_baslik = oku_().baslik; ai("duzenle"); };
  document.getElementById("fOzet").onclick = function(){ oku_baslik = oku_().baslik; ai("ozet"); };
  document.getElementById("fKaydet").onclick = function(){ var f = oku_(); if(!puan){ toast("Önce rüyanı puanla 🙂"); return; } bitir({ baslik:f.baslik, metin:f.metin, ham:"", mod:"ham" }); };
  var vb = document.getElementById("fVaz"), vo = false;
  vb.onclick = function(){ if(!vo && oku_().metin.length > 20){ vo = true; vb.textContent = "Yazdıkların silinecek, emin misin?"; return; } kapat(); };
}

/* ---------- şifre ayarları ---------- */
function kilitKur(sifre){
  var salt = b64(crypto.getRandomValues(new Uint8Array(16))), iter = 250000, key, simdi = Date.now();
  return rHazirla().then(function(){ return anahtarTuret(sifre, salt, iter); }).then(function(k){ key = k; return sifrele(key, "dolphsleep-ok"); }).then(function(dog){
    var ids = Object.keys(R.kayit).filter(function(id){ return !R.kayit[id].sil && rAcik[id] && !rAcik[id].bozuk; });
    return Promise.all(ids.map(function(id){ return sifrele(key, rAcik[id]).then(function(e){ R.kayit[id] = { id:id, gun:R.kayit[id].gun, t:simdi, enc:e }; rAcikT[id] = simdi; }); })).then(function(){
      R.kilit = { aktif:true, salt:salt, iter:iter, dog:dog, t:simdi }; R.soruldu = true; KRIPTO.key = key; rYaz();
      ids.forEach(function(id){ rBulutaYaz(R.kayit[id]); }); kilitBulutaYaz();
    });
  });
}
function kilitKaldir(){
  var simdi = Date.now();
  return rHazirla().then(function(){
    Object.keys(R.kayit).forEach(function(id){ if(R.kayit[id].sil || !rAcik[id] || rAcik[id].bozuk) return; R.kayit[id] = { id:id, gun:R.kayit[id].gun, t:simdi, acik:rAcik[id] }; rAcikT[id] = simdi; rBulutaYaz(R.kayit[id]); });
    R.kilit = { aktif:false, t:simdi }; KRIPTO.key = null; rYaz(); kilitBulutaYaz();
  });
}
function sifreKoySayfa(){

  sayfa.innerHTML = '<h3>🔒 '+(degis ? 'Yeni şifre' : 'Rüyalarına şifre koy')+'</h3><p>Rüyaların bu şifreyle telefonunda kilitlenir, buluta kilitli gider. Sitenin sahibi dahil kimse okuyamaz.</p>'+
    '<div class="bilgiK">⚠️ <b style="color:var(--yazi)">Şifreni unutursan rüyaların geri getirilemez.</b> Sıfırlama yolu yok, bir yere not et. Yapay zekâ ile düzenlediğin rüya sadece düzenleme sırasında yapay zekâya gider.</div>'+
    '<input type="password" class="sifreIn" id="s1" placeholder="Şifre (en az 4 karakter)" autocomplete="new-password"><input type="password" class="sifreIn" id="s2" placeholder="Şifre tekrar" autocomplete="new-password">'+
    '<button class="ana" id="sKoy">'+(degis ? 'Şifreyi değiştir' : 'Şifreyi koy')+'</button><button class="ikinci" id="tm">Vazgeç</button>';
  ac(); document.getElementById("tm").onclick = kapat;
  var b = document.getElementById("sKoy");
  b.onclick = function(){
    var a = document.getElementById("s1").value, c = document.getElementById("s2").value;
    if(a.length < 4){ toast("En az 4 karakter"); return; }
    if(a !== c){ toast("Şifreler aynı değil"); return; }
    b.disabled = true; b.textContent = "Kilitleniyor…";
    kilitKur(a).then(function(){ kapat(); ruyaCiz(); toast(degis ? "Şifre değişti 🔒" : "Rüyaların artık şifreli 🔒"); }).catch(function(){ b.disabled = false; b.textContent = "Tekrar dene"; toast("Olmadı, tekrar dene"); });
  };
}
function sifreAyarSayfa(){
  if(!kilitli()){ sifreKoySayfa(); return; }
  sayfa.innerHTML = '<h3>🔒 Şifre ayarları</h3><p>Rüyaların şu an şifreli.</p><button class="ana" id="sDeg">Şifreyi değiştir</button><button class="ikinci" id="sKal">Şifreyi kaldır</button><button class="ikinci" id="tm">Kapat</button>';
  ac(); document.getElementById("tm").onclick = kapat; document.getElementById("sDeg").onclick = sifreKoySayfa;
  var k = document.getElementById("sKal"), o = false;
  k.onclick = function(){ if(!o){ o = true; k.textContent = "Rüyalar şifresiz kalacak. Emin misin?"; return; } kilitKaldir().then(function(){ kapat(); ruyaCiz(); toast("Şifre kaldırıldı"); }); };
}
function unuttumSayfa(){
  sayfa.innerHTML = '<h3>Şifreni mi unuttun?</h3><p>Rüyaların senin şifrenle kilitli, bu yüzden kimse (biz dahil) açamaz. Hatırlamaya çalış: büyük/küçük harf, Türkçe karakter…</p>'+
    '<div class="bilgiK">Hatırlamıyorsan tek yol: kilitli rüyaları silip yeniden başlamak. Bunun için aşağıya <b style="color:var(--yazi)">SİL</b> yaz.</div>'+
    '<input class="sifreIn" id="uSil" placeholder="SİL"><button class="ikinci" id="uBtn" style="color:var(--kirmizi)">Tüm rüyaları sil, baştan başla</button><button class="ana" id="tm" style="margin-top:10px">Vazgeç</button>';
  ac(); document.getElementById("tm").onclick = kapat;
  document.getElementById("uBtn").onclick = function(){
    if(document.getElementById("uSil").value.trim().toLocaleUpperCase("tr") !== "SİL"){ toast("Onay için SİL yaz"); return; }
    var simdi = Date.now();
    Object.keys(R.kayit).forEach(function(id){ if(!R.kayit[id].sil){ R.kayit[id] = { id:id, gun:R.kayit[id].gun || "", t:simdi, sil:true }; rBulutaYaz(R.kayit[id]); } });
    R.kilit = { aktif:false, t:simdi }; R.soruldu = false; KRIPTO.key = null; rAcik = {}; rAcikT = {}; rYaz(); kilitBulutaYaz();
    kapat(); ruyaCiz(); toast("Sıfırlandı");
  };
}

/* ---------- GÜN sekmesi ---------- */
var RUH = [["😞","Çok kötü"],["😕","Kötü"],["😐","İdare"],["🙂","İyi"],["😄","Çok iyi"]];
var RUH_RENK = ["#ff6b7f","#ff9f6b","#ffc857","#8fd9a8","#4fe0a0"];
var gGun = null;
function gunCiz(){
  gHazir();
  var bugun = isoGun(Date.now()); if(!gGun || gGun > bugun) gGun = bugun;
  var d = gunDoc(gGun), bu = gGun === bugun, k = document.getElementById("gunIc");
  var h = '<div class="baslikS">Gün</div><p class="altS">Gün içinde nasıl hissettiğini kaydet, akşam günü kapat.</p>'+
    '<div class="gunNav"><button id="gGeri">‹</button><b>'+(bu ? 'Bugün · ' : '')+gunKisa(gGun)+' '+GUNTAM[new Date(kodTs(gGun)).getDay()]+'</b><button id="gIleri" '+(bu ? 'disabled' : '')+'>›</button></div>'+
    '<section class="kart"><h2>'+(bu ? 'Şu an nasılsın?' : 'Bu güne kayıt ekle')+'</h2><div class="ruhSec">'+RUH.map(function(r, i){ return '<button data-v="'+(i+1)+'">'+r[0]+'</button>'; }).join("")+'</div><div class="ruhAd">'+RUH.map(function(r){ return '<span>'+r[1]+'</span>'; }).join("")+'</div></section>';
  if(d.anlar.length){
    h += '<section class="kart"><h2>Duygu çizgin <small>'+d.anlar.length+' kayıt · ort. '+RUH[Math.round(d.anlar.reduce(function(t,a){ return t+a.p; },0)/d.anlar.length)-1][0]+'</small></h2>'+ruhGrafik(d.anlar)+'</section>'+
      '<section class="kart"><h2>Kayıtlar</h2>'+d.anlar.slice().reverse().map(function(a){ return '<div class="an"><span class="anS">'+hm(a.t)+'</span><span class="anE">'+RUH[a.p-1][0]+'</span><span class="anN'+(a.not ? '' : ' bosN')+'">'+(a.not ? esc(a.not) : RUH[a.p-1][1])+'</span><button data-a="'+a.id+'" aria-label="Düzenle">✎</button></div>'; }).join("")+'</section>';
  }
  if(d.kapanis){
    var kp = d.kapanis;
    h += '<div class="kapanisK"><h4>🌙 '+esc(kp.baslik || 'Günün özeti')+'</h4>'+(kp.analiz ? '<div class="ruyaMetin">'+esc(kp.analiz)+'</div>' : '')+
      (kp.metin ? (kp.analiz ? '<details><summary>Bugün neler yaptım</summary><div class="ruyaMetin">'+esc(kp.metin)+'</div></details>' : '<div class="ruyaMetin">'+esc(kp.metin)+'</div>') : '')+
      '<div class="ikiBtn"><button class="ikinci" id="gKapDuz">✏️ Düzenle</button>'+(kp.metin || d.anlar.length ? '<button class="ikinci" id="gKapAi">✨ '+(kp.analiz ? 'Yeniden analiz' : 'Analiz et')+'</button>' : '')+'</div></div>';
  } else h += '<button class="kapanBtn" id="gKapat">🌙 Günü kapat<br><small style="font-weight:500;color:var(--soluk)">Bugün neler yaptın? Yapay zekâ gününü özetlesin</small></button>';
  if(ozelDurum==="izin") h += '<div class="bilgiK">☁️ Bulut kuralı eksik: gün kayıtların şimdilik sadece bu cihazda.</div>';
  else h += '<p class="not">Gün kayıtların sadece sana açık.</p>';
  k.innerHTML = h;
  document.getElementById("gGeri").onclick = function(){ gGun = gunEkle(gGun, -1); gunCiz(); };
  document.getElementById("gIleri").onclick = function(){ gGun = gunEkle(gGun, 1); gunCiz(); };
  k.querySelectorAll(".ruhSec button").forEach(function(b){ b.onclick = function(){ anSayfa(null, +b.getAttribute("data-v")); }; });
  k.querySelectorAll("[data-a]").forEach(function(b){ b.onclick = function(){ anSayfa(b.getAttribute("data-a")); }; });
  var kb = document.getElementById("gKapat"); if(kb) kb.onclick = function(){ kapanisSayfa(); };
  var kd = document.getElementById("gKapDuz"); if(kd) kd.onclick = function(){ kapanisSayfa(); };
  var ka = document.getElementById("gKapAi"); if(ka) ka.onclick = function(){ gunAnaliz(gGun, (gunDoc(gGun).kapanis || {}).metin || "", ka); };
}
function ruhGrafik(l){
  var W = 340, H = 150, sol = 26, sag = 10, ust = 14, alt = 22;
  var t0 = new Date(kodTs(isoGun(l[0].t))).getTime(), basS = Math.min(8, Math.floor((l[0].t - t0)/36e5)), sonS = Math.max(23, Math.ceil((l[l.length-1].t - t0)/36e5));
  var X = function(ts){ return sol + ((ts - t0)/36e5 - basS)/(sonS - basS)*(W - sol - sag); }, Y = function(p){ return ust + (5 - p)/4*(H - ust - alt); };
  var s = '<svg class="graf" viewBox="0 0 '+W+' '+H+'"><defs><linearGradient id="rg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8d7bff" stop-opacity=".45"/><stop offset="1" stop-color="#8d7bff" stop-opacity="0"/></linearGradient></defs>';
  for(var p=1;p<=5;p++) s += '<line x1="'+sol+'" x2="'+(W-sag)+'" y1="'+Y(p)+'" y2="'+Y(p)+'" stroke="rgba(255,255,255,.06)"/><circle cx="'+(sol-10)+'" cy="'+Y(p)+'" r="4" fill="'+RUH_RENK[p-1]+'"/>';
  for(var h=basS; h<=sonS; h+=3) s += '<text x="'+X(t0 + h*36e5)+'" y="'+(H-6)+'" fill="#9aa3c7" font-size="10" text-anchor="middle">'+pad(h%24)+'</text>';
  var pts = l.map(function(a){ return [X(a.t), Y(a.p)]; });
  if(pts.length > 1){
    var yol = "M"+pts.map(function(q){ return q[0].toFixed(1)+","+q[1].toFixed(1); }).join(" L");
    s += '<path d="'+yol+' L'+pts[pts.length-1][0].toFixed(1)+','+(H-alt)+' L'+pts[0][0].toFixed(1)+','+(H-alt)+' Z" fill="url(#rg)"/><path d="'+yol+'" fill="none" stroke="#b9b0ff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  l.forEach(function(a, i){ s += '<circle cx="'+pts[i][0].toFixed(1)+'" cy="'+pts[i][1].toFixed(1)+'" r="5" fill="'+RUH_RENK[a.p-1]+'" stroke="#0b1026" stroke-width="2"/>'; });
  return s + '</svg>';
}
function anSayfa(id, p){
  var d = gunDoc(gGun), a = id ? d.anlar.filter(function(x){ return x.id === id; })[0] : null, bu = gGun === isoGun(Date.now());
  if(id && !a) return;
  p = a ? a.p : p;
  var saat = a ? hm(a.t) : bu ? hm(Date.now()) : "12:00";
  perdeSabit = true;
  sayfa.innerHTML = '<h3 id="anB">'+RUH[p-1][0]+' '+RUH[p-1][1]+'</h3><p>'+gunUzun(gGun)+'</p>'+
    '<div class="ruhSec" id="anSec" style="margin-bottom:12px">'+RUH.map(function(r, i){ return '<button data-v="'+(i+1)+'" class="'+(p===i+1 ? 'on' : '')+'" style="font-size:24px">'+r[0]+'</button>'; }).join("")+'</div>'+
    '<div class="alan" style="grid-template-columns:1fr"><label>Saat<input type="time" id="anSaat" value="'+saat+'"></label></div>'+
    '<textarea class="yaziAlan" id="anNot" style="min-height:110px" placeholder="Not bırak (isteğe bağlı): ne oldu, neden böyle hissediyorsun?">'+esc(a ? a.not : "")+'</textarea>'+
    '<button class="ana" id="anKay">Kaydet</button>'+(a ? '<button class="ikinci" id="anSil" style="color:var(--kirmizi)">Sil</button>' : '')+'<button class="ikinci" id="anVaz">Vazgeç</button>';
  ac();
  sayfa.querySelectorAll("#anSec button").forEach(function(b){ b.onclick = function(){ p = +b.getAttribute("data-v"); sayfa.querySelectorAll("#anSec button").forEach(function(c){ c.classList.toggle("on", c===b); }); document.getElementById("anB").textContent = RUH[p-1][0]+" "+RUH[p-1][1]; }; });
  document.getElementById("anVaz").onclick = kapat;
  document.getElementById("anKay").onclick = function(){
    var s = (document.getElementById("anSaat").value || saat).split(":"), t = new Date(kodTs(gGun)); t.setHours(+s[0], +s[1], 0, 0);
    var yeni = { id:a ? a.id : rid(), t:t.getTime(), p:p, not:document.getElementById("anNot").value.trim(), d:Date.now() };
    gunGuncelle(gGun, function(x){ x.anlar = x.anlar.filter(function(y){ return y.id !== yeni.id; }); x.anlar.push(yeni); x.anlar.sort(function(m,n){ return m.t - n.t; }); });
    kapat(); gunCiz(); toast(RUH[p-1][0]+" Kaydedildi");
  };
  var sb = document.getElementById("anSil"); if(sb) sb.onclick = function(){ gunGuncelle(gGun, function(x){ x.anlar = x.anlar.filter(function(y){ return y.id !== a.id; }); x.sil = x.sil || {}; x.sil[a.id] = Date.now(); }); kapat(); gunCiz(); };
}
function kapanisSayfa(){
  var d = gunDoc(gGun), kp = d.kapanis || {};
  perdeSabit = true;
  sayfa.innerHTML = '<h3>🌙 Günü kapat</h3><p>'+gunUzun(gGun)+'<br>Bugün neler yaptın? Kısaca yaz; istersen yapay zekâ gün içindeki duygularınla birlikte gününü analiz etsin.</p>'+
    '<textarea class="yaziAlan" id="kMetin" placeholder="Sabah derse gittim, öğlen spor yaptım, akşam arkadaşlarla…">'+esc(kp.metin || "")+'</textarea>'+
    '<button class="ana aiBtn" id="kAi">✨ Analiz et ve kapat</button><div class="ikiBtn"><button class="ikinci" id="kKay">Sadece kaydet</button><button class="ikinci" id="kVaz">Vazgeç</button></div>';
  ac();
  document.getElementById("kVaz").onclick = kapat;
  document.getElementById("kKay").onclick = function(){
    var m = document.getElementById("kMetin").value.trim();
    gunGuncelle(gGun, function(x){ x.kapanis = Object.assign({}, x.kapanis || {}, { metin:m, d:Date.now() }); if(!x.kapanis.analiz) x.kapanis.analiz = ""; if(!x.kapanis.baslik) x.kapanis.baslik = ""; });
    kapat(); gunCiz(); toast("İyi geceler 🌙");
  };
  document.getElementById("kAi").onclick = function(){
    var m = document.getElementById("kMetin").value.trim();
    if(!m && !d.anlar.length){ toast("Önce birkaç kelime yaz"); return; }
    gunAnaliz(gGun, m);
  };
}
function gunAnaliz(gun, metin, btn){
  var d = gunDoc(gun);
  var anlar = d.anlar.map(function(a){ return hm(a.t)+" — "+RUH[a.p-1][0]+" "+RUH[a.p-1][1]+" ("+a.p+"/5)"+(a.not ? " — "+a.not : ""); }).join("\n");
  if(btn){ btn.disabled = true; btn.textContent = "Analiz ediliyor…"; } else dusunCiz("Yapay zekâ gününü analiz ediyor…");
  aiIste("gun", { metin:metin, anlar:anlar, gun:gunUzun(gun) }).then(function(j){
    gunGuncelle(gun, function(x){ x.kapanis = { metin:metin, baslik:j.baslik || "", analiz:j.metin, d:Date.now() }; });
    if(!btn) kapat(); gunCiz(); toast("Gün kapandı 🌙");
  }).catch(function(e){ toast(aiHataYazi(e)); if(btn){ btn.disabled = false; btn.textContent = "✨ Tekrar dene"; } else kapanisSayfa(); });
}

/* ---------- arka planda 5 dk kalınca rüyaları kilitle ---------- */
var gizlendi = 0;
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "hidden") gizlendi = Date.now();
  else if(gizlendi && Date.now() - gizlendi > 5*60000 && KRIPTO.key){ KRIPTO.key = null; rAcik = {}; rAcikT = {}; if(aktifSekme===1) ruyaCiz(); }
});
rHazir(); gHazir();
</script>
</body>
</html>
