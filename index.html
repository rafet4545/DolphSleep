<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1026">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DolphSleep">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>DolphSleep</title>
<style>
:root{
  --bg:#0b1026;--bg2:#121a3a;--kart:rgba(255,255,255,.055);--cizgi:rgba(255,255,255,.1);
  --yazi:#eef0ff;--soluk:#9aa3c7;--ay:#ffd98a;--mor:#8d7bff;--yesil:#4fe0a0;--kirmizi:#ff6b7f;--sari:#ffc857;--mavi:#6ab8e4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:radial-gradient(120% 70% at 50% 0%,#1d2660 0%,var(--bg) 60%) fixed,var(--bg);color:var(--yazi);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(40px + env(safe-area-inset-bottom));overscroll-behavior-y:none}
.yildiz{position:fixed;inset:0;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:460px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 0 6px}
.logo{display:flex;align-items:center;gap:10px}
.logo img{width:40px;height:40px;border-radius:11px}
header h1{font-size:20px;margin:0;letter-spacing:.2px}
header small{color:var(--soluk);font-size:13px}
.hesapBtn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);border:1px solid var(--cizgi);color:var(--yazi);border-radius:99px;padding:6px 12px 6px 6px;font-size:13px;cursor:pointer;max-width:48%}
.hesapBtn img,.hesapBtn .bos{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.1);font-size:14px}
.hesapBtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saat{font-size:56px;font-weight:800;text-align:center;margin:14px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:1px}
.durum{text-align:center;color:var(--soluk);font-size:15px;min-height:22px}
.buyuk{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:200px;height:200px;margin:22px auto 10px;border-radius:50%;border:0;cursor:pointer;color:#1a1300;font-weight:800;font-size:20px;
  background:radial-gradient(circle at 35% 30%,#fff3cf,var(--ay) 55%,#d9a441);box-shadow:0 0 0 10px rgba(255,217,138,.08),0 0 60px rgba(255,217,138,.35);transition:transform .15s;font-family:inherit}
.buyuk:active{transform:scale(.96)}
.buyuk .e{font-size:54px;line-height:1}
.buyuk.uyanik{color:#fff;background:radial-gradient(circle at 35% 30%,#b9b0ff,var(--mor) 55%,#4a3bc9);box-shadow:0 0 0 10px rgba(141,123,255,.1),0 0 60px rgba(141,123,255,.45);animation:nefes 4s ease-in-out infinite}
@keyframes nefes{50%{box-shadow:0 0 0 18px rgba(141,123,255,.06),0 0 80px rgba(141,123,255,.55)}}
.hedef{text-align:center;color:var(--soluk);font-size:13px;margin-bottom:12px}
.hedef b{color:var(--yazi)}
.uyari{display:flex;align-items:center;gap:10px;background:rgba(255,200,87,.12);border:1px solid rgba(255,200,87,.35);border-radius:16px;padding:12px 14px;margin:10px 0;font-size:14px}
.uyari b{display:block}
.uyari button{margin-left:auto;flex:none}
.kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:20px;padding:16px;margin:14px 0;backdrop-filter:blur(6px)}
.kart h2{font-size:15px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.kart h2 small{color:var(--soluk);font-weight:500;font-size:12px}
.istat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ist{background:rgba(255,255,255,.04);border-radius:14px;padding:12px}
.ist b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.ist span{color:var(--soluk);font-size:12px}
.ist.iyi b{color:var(--yesil)}.ist.kotu b{color:var(--kirmizi)}.ist.orta b{color:var(--sari)}
svg.graf{width:100%;height:auto;display:block}
.gece{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--cizgi)}
.gece:first-child{border-top:0}
.gece .g{width:62px;font-size:13px;color:var(--soluk)}
.gece .g b{display:block;color:var(--yazi);font-size:14px}
.gece .s{flex:1;font-size:14px;font-variant-numeric:tabular-nums}
.gece .s small{display:block;color:var(--soluk);font-size:12px}
.etk{font-size:12px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.07);white-space:nowrap}
.etk.ok{color:var(--yesil)}.etk.no{color:var(--kirmizi)}.etk.er{color:var(--sari)}
.gece button{background:none;border:0;color:var(--soluk);font-size:16px;cursor:pointer;padding:6px}
.kucuk{background:rgba(255,255,255,.07);border:1px solid var(--cizgi);color:var(--yazi);border-radius:12px;padding:10px 14px;font-size:14px;cursor:pointer;font-family:inherit}
.bos{color:var(--soluk);font-size:14px;text-align:center;padding:10px 0}
.alt{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.perde{position:fixed;inset:0;background:rgba(5,8,20,.7);display:none;align-items:flex-end;justify-content:center;z-index:10;backdrop-filter:blur(4px)}
.perde.ac{display:flex}
.sayfa{background:var(--bg2);border:1px solid var(--cizgi);border-radius:24px 24px 0 0;width:100%;max-width:460px;padding:20px 18px calc(22px + env(safe-area-inset-bottom));animation:yuk .25s ease-out;max-height:90vh;overflow:auto}
@keyframes yuk{from{transform:translateY(40px);opacity:0}}
.sayfa h3{margin:0 0 4px;font-size:19px}
.sayfa p{margin:0 0 14px;color:var(--soluk);font-size:14px;line-height:1.45}
.sec{display:flex;gap:8px;margin-bottom:16px}
.sec button{flex:1;padding:12px 4px;border-radius:14px;border:1px solid var(--cizgi);background:rgba(255,255,255,.05);color:var(--yazi);font-size:24px;cursor:pointer;font-family:inherit}
.sec.yazi button{font-size:14px}
.sec button.on{border-color:var(--ay);background:rgba(255,217,138,.15)}
.ana{width:100%;padding:14px;border:0;border-radius:14px;background:var(--ay);color:#1a1300;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}
.ana:disabled{opacity:.4}
.ana.mavi{background:#fff;color:#1f1f1f;display:flex;align-items:center;justify-content:center;gap:10px}
.ikinci{width:100%;margin-top:10px;padding:13px;border-radius:14px;border:1px solid var(--cizgi);background:rgba(255,255,255,.06);color:var(--yazi);font-size:15px;cursor:pointer;font-family:inherit}
.alan{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.alan label{font-size:12px;color:var(--soluk)}
.alan input{width:100%;margin-top:4px;padding:10px;border-radius:12px;border:1px solid var(--cizgi);background:rgba(255,255,255,.06);color:var(--yazi);font-size:15px;color-scheme:dark;font-family:inherit}
.sonuc{text-align:center;padding:6px 0 14px}
.sonuc .b{font-size:40px;font-weight:800}
.satir{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--cizgi)}
.satir:first-of-type{border-top:0}
.satir .yz{flex:1;font-size:15px}.satir .yz small{display:block;color:var(--soluk);font-size:12px;margin-top:2px}
.dugme{width:50px;height:30px;border-radius:99px;border:0;background:rgba(255,255,255,.15);position:relative;cursor:pointer;flex:none}
.dugme::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.dugme.on{background:var(--yesil)}.dugme.on::after{left:23px}
.not{font-size:12px;color:var(--soluk);text-align:center;margin-top:18px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1e2752;border:1px solid var(--cizgi);color:var(--yazi);padding:10px 16px;border-radius:14px;font-size:14px;z-index:20;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.gor{opacity:1}
#giris{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:radial-gradient(120% 70% at 50% 0%,#1d2660 0%,var(--bg) 65%),var(--bg)}
#giris[hidden]{display:none}
#giris img{width:120px;height:120px;border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#giris h2{margin:6px 0 0;font-size:28px}#giris p{margin:0;color:var(--soluk);max-width:320px;line-height:1.5}
#giris .ana{max-width:340px}
.ustBtn{display:flex;gap:8px}
.lider{display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:14px;margin:4px 0;background:rgba(255,255,255,.04)}
.lider.ben{background:rgba(255,217,138,.13);border:1px solid rgba(255,217,138,.35)}
.lider .sira{width:28px;text-align:center;font-weight:800;font-size:16px}
.lider .ad{flex:1;min-width:0}.lider .ad b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lider .ad small{color:var(--soluk);font-size:12px}
.lider .puan{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.adm{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--cizgi);cursor:pointer}
.adm:first-child{border-top:0}
.adm img,.adm .bos{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.1)}
.adm .yz{flex:1;min-width:0;font-size:14px}.adm .yz b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.adm .yz small{display:block;color:var(--soluk);font-size:12px}
.ozet{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 12px}
.ozet div{background:rgba(255,255,255,.05);border-radius:12px;padding:10px;text-align:center}.ozet b{display:block;font-size:20px}.ozet span{font-size:11px;color:var(--soluk)}
.takmaGir{width:100%;padding:13px;border-radius:14px;border:1px solid var(--cizgi);background:rgba(255,255,255,.06);color:var(--yazi);font-size:16px;margin-bottom:12px;font-family:inherit}
.bulut{font-size:12px;color:var(--soluk);text-align:center;margin-top:6px}
</style>
</head>
<body>
<canvas class="yildiz" id="yildiz"></canvas>
<main>
  <header>
    <div class="logo"><img src="icon-192.png" alt=""><div><h1>DolphSleep</h1><small id="tarih"></small></div></div>
    <div class="ustBtn"><button class="hesapBtn" id="liderBtn" style="padding:6px 12px"><span>🏆</span></button><button class="hesapBtn" id="hesapBtn"><span class="bos">👤</span><span>Giriş yap</span></button></div>
  </header>

  <div class="saat" id="saat">--:--</div>
  <div class="durum" id="durum"></div>
  <button class="buyuk" id="buyuk"><span class="e" id="buyukE">🌙</span><span id="buyukY">Uyuyorum</span></button>
  <div class="hedef">Hedef: <b>23:00–23:30</b> arası yat · <b>07:30</b>'da kalk</div>
  <div id="uyariKutu"></div>

  <section class="kart">
    <h2>Bu hafta <small>son 7 gece</small></h2>
    <div class="istat" id="istat"></div>
  </section>

  <section class="kart">
    <h2>Uyku saatlerin <small>sarı bant = hedef</small></h2>
    <div id="graf"></div>
  </section>

  <section class="kart">
    <h2>Geceler <button class="kucuk" id="ekleBtn" style="padding:6px 10px;font-size:13px">＋ Gece ekle</button></h2>
    <div id="liste"></div>
  </section>

  <div class="alt"><button class="kucuk" id="ayarBtn">⚙️ Ayarlar</button><button class="kucuk" id="adminBtn" hidden>🛠 Admin</button></div>
  <div class="bulut" id="bulutYazi"></div>
  <p class="not">DolphSleep · Rafet Emre Türkoğlu · v<span id="surum"></span></p>
</main>

<div id="giris"><img src="icon-512.png" alt=""><h2>DolphSleep</h2><p>Uykunu takip et, düzenini gör, arkadaşlarınla yarış 🌙</p>
  <button class="ana mavi" id="girisGoogle"><svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Google ile giriş yap</button>
  <p id="girisDurum" style="font-size:13px"></p></div>
<div class="perde" id="perde"><div class="sayfa" id="sayfa"></div></div>
<div class="toast" id="toast"></div>

<script>
var SURUM = 2;
document.getElementById("surum").textContent = SURUM;
var HEDEF = { yatBas: 23*60, yatSon: 23*60+30, kalk: 7*60+30, kalkTol: 15, sure: 8*60, hatirlat: 22*60+30 };
var KEY = "dolphsleep.v1", AYAR_KEY = "dolphsleep.ayar.v1";

/* ---------- veri ---------- */
function bosVeri(){ return { geceler:[], aktif:null, aktifT:0, silinen:{} }; }
function oku(){ try{ var v = JSON.parse(localStorage.getItem(KEY)); if(v && v.geceler){ v.silinen = v.silinen || {}; v.aktifT = v.aktifT || 0; v.geceler.forEach(function(g){ if(!g.id) g.id = "g"+g.y; if(!g.t) g.t = g.k || Date.now(); }); return v; } }catch(e){} return bosVeri(); }
var veri = oku();
var ayar = (function(){ try{ return JSON.parse(localStorage.getItem(AYAR_KEY)) || {}; }catch(e){ return {}; } })();
function ayarYaz(){ try{ localStorage.setItem(AYAR_KEY, JSON.stringify(ayar)); }catch(e){} }
function yaz(bulutaDa){ try{ localStorage.setItem(KEY, JSON.stringify(veri)); }catch(e){} if(bulutaDa !== false) bulutYukleSonra(); }

/* ---------- yardımcılar ---------- */
function pad(n){ return (n<10?"0":"")+n; }
function hm(ts){ var d = new Date(ts); return pad(d.getHours())+":"+pad(d.getMinutes()); }
function dk(ts){ var d = new Date(ts); return d.getHours()*60 + d.getMinutes(); }
function geceDk(ts){ var m = dk(ts); return m < 12*60 ? m + 1440 : m; }
function sureYaz(m){ m = Math.max(0, Math.round(m)); var h = Math.floor(m/60); return h ? h+" sa "+pad(m%60)+" dk" : (m%60)+" dk"; }
var GUN = ["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"], AY = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
function gunEt(ts){ var d = new Date(ts); return GUN[d.getDay()]+" "+d.getDate()+" "+AY[d.getMonth()]; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]; }); }
var toastZ = 0;
function toast(m){ var t = document.getElementById("toast"); t.textContent = m; t.classList.add("gor"); clearTimeout(toastZ); toastZ = setTimeout(function(){ t.classList.remove("gor"); }, 2600); }

function degerlendir(g){
  var y = geceDk(g.y), k = dk(g.k), s = (g.k - g.y)/60000;
  var yat = y < HEDEF.yatBas ? "er" : y <= HEDEF.yatSon ? "ok" : "no";
  var kalk = Math.abs(k - HEDEF.kalk) <= HEDEF.kalkTol ? "ok" : k < HEDEF.kalk ? "er" : "no";
  return { yat:yat, kalk:kalk, sure:s, tam: yat!=="no" && kalk!=="no" };
}
function sirali(){ return veri.geceler.slice().sort(function(a,b){ return b.y-a.y; }); }
function sonGeceler(n){ return sirali().slice(0, n); }
function sd(a){ if(a.length<2) return 0; var o = a.reduce(function(x,y){return x+y;},0)/a.length; return Math.sqrt(a.reduce(function(x,y){return x+(y-o)*(y-o);},0)/a.length); }

/* ---------- çizim ---------- */
function ciz(){
  var simdi = Date.now();
  document.getElementById("tarih").textContent = gunEt(simdi);
  var b = document.getElementById("buyuk");
  if(veri.aktif){
    b.classList.add("uyanik"); document.getElementById("buyukE").textContent = "☀️"; document.getElementById("buyukY").textContent = "Uyandım";
    document.getElementById("durum").textContent = hm(veri.aktif)+"'den beri uyuyorsun · "+sureYaz((simdi-veri.aktif)/60000);
  } else {
    b.classList.remove("uyanik"); document.getElementById("buyukE").textContent = "🌙"; document.getElementById("buyukY").textContent = "Uyuyorum";
    var m = dk(simdi), kal = HEDEF.yatSon - m;
    document.getElementById("durum").textContent = (m >= 18*60 && kal > 0) ? "Yatmaya "+sureYaz(kal)+" kaldı" : (m >= HEDEF.yatSon || m < 4*60) ? "Hedef saati geçti, hemen yat 😴" : "İyi günler ☀️";
  }
  uyariCiz(); istatCiz(); grafCiz(); listeCiz(); hesapCiz();
}
function uyariCiz(){
  var k = document.getElementById("uyariKutu"), simdi = Date.now(), m = dk(simdi), h = "";
  if(veri.aktif && simdi - veri.aktif > 16*36e5){
    h = '<div class="uyari"><span>⏰</span><div><b>Uyandım\'a basmayı unuttun</b>'+gunEt(veri.aktif)+' '+hm(veri.aktif)+'\'den beri açık.</div><button class="kucuk" id="uyFix">Düzelt</button></div>';
  } else if(!veri.aktif && m >= 5*60 && m < 15*60){
    var bugun = new Date(); bugun.setHours(0,0,0,0);
    var var_ = veri.geceler.some(function(g){ return g.k >= bugun.getTime(); });
    var dun = (ayar.unuttumGec || "") === bugun.toDateString();
    if(!var_ && !dun) h = '<div class="uyari"><span>🌙</span><div><b>Dün gece butona basmadın</b>Kaçta yattın, kaçta kalktın?</div><button class="kucuk" id="uyEkle">Ekle</button></div>';
  }
  k.innerHTML = h;
  var f = document.getElementById("uyFix"); if(f) f.onclick = function(){ var d = new Date(veri.aktif + 8*36e5); duzenle(null, { y:veri.aktif, k:d.getTime(), aktifKapat:true }); };
  var e = document.getElementById("uyEkle"); if(e) e.onclick = function(){ duzenle(null); };
}
function istatHesap(geceler){
  var l = geceler.slice().sort(function(a,b){ return b.y-a.y; }), l7 = l.slice(0, 7);
  if(!l7.length) return null;
  var d = l7.map(degerlendir), ort = d.reduce(function(x,y){return x+y.sure;},0)/d.length;
  var borc = d.reduce(function(x,y){ return x + Math.max(0, HEDEF.sure - y.sure); },0);
  var duzen = l7.length > 1 ? Math.max(0, Math.round(100 - (sd(l7.map(function(g){return geceDk(g.y);})) + sd(l7.map(function(g){return dk(g.k);})))/2 * 1.4)) : null;
  var seri = 0; for(var i=0;i<l.length;i++){ if(degerlendir(l[i]).tam) seri++; else break; }
  var ortYat = Math.round(l7.reduce(function(x,g){ return x + geceDk(g.y); },0)/l7.length);
  return { ort:ort, borc:borc, duzen:duzen, seri:seri, hedefte:d.filter(function(x){return x.tam;}).length, n:d.length, ortYat:ortYat };
}
function saatYaz(m){ m = ((Math.round(m) % 1440) + 1440) % 1440; return pad(Math.floor(m/60))+":"+pad(m%60); }
function haftaBas(ts){ var d = new Date(ts || Date.now()); d.setHours(0,0,0,0); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return d; }
function haftaKod(ts){ var d = haftaBas(ts); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
/* haftalık puan: hedefe tam uyulan gece +10, sadece yatış zamanında +5, seri devam ediyorsa +5; haftada en az 3 gece varsa düzen bonusu (düzen/10) */
function haftaPuan(geceler){
  var bas = haftaBas().getTime(), tum = geceler.slice().sort(function(a,b){ return a.y-b.y; }), seri = 0, puan = 0, bu = [];
  tum.forEach(function(g){ var d = degerlendir(g); seri = d.tam ? seri+1 : 0; if(g.k >= bas){ bu.push(g); puan += d.tam ? 10 : (d.yat!=="no" ? 5 : 0); if(d.tam && seri > 1) puan += 5; } });
  if(bu.length >= 3){ var h = istatHesap(bu); if(h && h.duzen!=null) puan += Math.round(h.duzen/10); }
  return { puan:puan, gece:bu.length };
}

function ist(b, s, c){ return '<div class="ist '+c+'"><b>'+b+'</b><span>'+s+'</span></div>'; }
function grafCiz(){ document.getElementById("graf").innerHTML = grafSvg(sonGeceler(7).reverse()); }
function grafSvg(l){
  if(!l.length) return '<div class="bos">Grafik ilk geceden sonra çıkar.</div>';
  var W = 340, H = 230, sol = 40, ust = 10, alt = 26, bas = 21*60, son = 34*60;
  var Y = function(m){ return ust + (Math.min(Math.max(m, bas), son)-bas)/(son-bas)*(H-ust-alt); };
  var s = '<svg class="graf" viewBox="0 0 '+W+' '+H+'">';
  s += '<rect x="'+sol+'" y="'+Y(HEDEF.yatBas)+'" width="'+(W-sol)+'" height="'+(Y(HEDEF.yatSon)-Y(HEDEF.yatBas))+'" fill="rgba(255,217,138,.3)"/>';
  s += '<rect x="'+sol+'" y="'+Y(1440+HEDEF.kalk-HEDEF.kalkTol)+'" width="'+(W-sol)+'" height="'+(Y(1440+HEDEF.kalk+HEDEF.kalkTol)-Y(1440+HEDEF.kalk-HEDEF.kalkTol))+'" fill="rgba(255,217,138,.3)"/>';
  for(var h=21; h<=34; h+=2){ var y = Y(h*60); s += '<line x1="'+sol+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="rgba(255,255,255,.07)"/><text x="'+(sol-6)+'" y="'+(y+4)+'" fill="#9aa3c7" font-size="10" text-anchor="end">'+pad(h%24)+':00</text>'; }
  var gw = (W-sol)/7;
  l.forEach(function(g, i){
    var d = degerlendir(g), x = sol + i*gw + gw*.22, w = gw*.56, y1 = Y(geceDk(g.y)), km = dk(g.k), y2 = Y(km < 12*60 ? km+1440 : km);
    var renk = d.tam ? "#4fe0a0" : (d.yat==="no" && d.kalk==="no") ? "#ff6b7f" : "#ffc857";
    s += '<rect x="'+x+'" y="'+y1+'" width="'+w+'" height="'+Math.max(4,y2-y1)+'" rx="'+(w/2)+'" fill="'+renk+'" opacity=".85"/>';
    s += '<text x="'+(x+w/2)+'" y="'+(H-8)+'" fill="#9aa3c7" font-size="10" text-anchor="middle">'+GUN[new Date(g.k).getDay()]+'</text>';
  });
  return s + '</svg>';
}

  ac(); document.getElementById("tm").onclick = kapat; document.getElementById("takmaDeg").onclick = function(){ takmaSor(false); };
  liderYukle().then(function(){ return FBS.F.getDocs(FBS.F.collection(FBS.db, "dolphsleepLider")); }).then(function(q){
    var l = []; q.forEach(function(d){ var x = d.data() || {}; if(x.hafta === haftaKod() && x.takma) l.push(Object.assign({ uid:d.id }, x)); });
    l.sort(function(a,b){ return (b.puan||0)-(a.puan||0) || (b.seri||0)-(a.seri||0); });
    var k = document.getElementById("liderListe"); if(!k) return;
    if(!l.length){ k.innerHTML = '<div class="bos">Bu hafta henüz kimse yok. İlk sen ol 🌙</div>'; return; }
    k.innerHTML = l.map(function(x, i){
      var ben = x.uid === kullanici.uid, sira = i===0 ? "👑" : i===1 ? "🥈" : i===2 ? "🥉" : (i+1);
      return '<div class="lider'+(ben?' ben':'')+'"><span class="sira">'+sira+'</span><span class="ad"><b>'+esc(x.takma)+(ben?' (sen)':'')+(x.uyuyor?' 🌙':'')+'</b><small>'+(x.ortYat!=null ? 'ort. yatış '+saatYaz(x.ortYat)+' · ' : '')+(x.gece||0)+' gece · 🔥'+(x.seri||0)+'</small></span><span class="puan">'+(x.puan||0)+'</span></div>';
    }).join("");
  }).catch(function(e){ var k = document.getElementById("liderListe"); if(k) k.innerHTML = '<div class="bos">'+(/permission/.test((e&&e.code)||"") ? "Liderlik tablosu henüz açık değil (Firestore kuralı eksik)." : "Yüklenemedi, internetini kontrol et.")+'</div>'; });
}

/* ---------- admin paneli (sadece Rafet) ---------- */
function adminAc(){
  if(!adminMi()) return;
  sayfa.innerHTML = '<h3>🛠 Admin · Kullanıcılar</h3><div id="admOzet"></div><div id="admListe"><div class="bos">Yükleniyor…</div></div><button class="ana" id="tm" style="margin-top:12px">Kapat</button>';
  ac(); document.getElementById("tm").onclick = kapat;
  FBS.F.getDocs(FBS.F.collection(FBS.db, "dolphsleep")).then(function(q){
    var l = []; q.forEach(function(d){ l.push(Object.assign({ uid:d.id }, d.data() || {})); });
    l.sort(function(a,b){ return (b.sonGorulme||0)-(a.sonGorulme||0); });
    window.__admL = l;
    var bugun = new Date(); bugun.setHours(0,0,0,0);
    document.getElementById("admOzet").innerHTML = '<div class="ozet"><div><b>'+l.length+'</b><span>kullanıcı</span></div><div><b>'+l.filter(function(x){ return (x.sonGorulme||0) >= bugun.getTime(); }).length+'</b><span>bugün açan</span></div><div><b>'+l.filter(function(x){ return x.aktif; }).length+'</b><span>şu an uyuyor 🌙</span></div></div>';
    document.getElementById("admListe").innerHTML = l.map(function(x, i){
      var p = x.profil || {}, g = (x.geceler || []).slice().sort(function(a,b){ return b.y-a.y; }), h = istatHesap(x.geceler || []);
      var son = g[0] ? hm(g[0].y)+' → '+hm(g[0].k) : 'kayıt yok';
      return '<div class="adm" data-i="'+i+'">'+(p.foto ? '<img src="'+esc(p.foto)+'" alt="" referrerpolicy="no-referrer">' : '<span class="bos">🐬</span>')+
        '<div class="yz"><b>'+esc(p.ad || p.email || x.uid)+(p.takma ? ' · '+esc(p.takma) : '')+(x.aktif ? ' 🌙' : '')+'</b><small>'+esc(p.email || "")+'</small>'+
        '<small>Son gece: '+son+(h ? ' · ort. '+sureYaz(h.ort)+' · düzen '+(h.duzen!=null ? h.duzen : '—')+' · 🔥'+h.seri : '')+'</small>'+
        '<small>Son görülme: '+(x.sonGorulme ? gunEt(x.sonGorulme)+' '+hm(x.sonGorulme) : '—')+'</small></div><span style="color:var(--soluk)">›</span></div>';
    }).join("") || '<div class="bos">Henüz kullanıcı yok.</div>';
    document.querySelectorAll("#admListe .adm").forEach(function(r){ r.onclick = function(){ adminKisi(window.__admL[+r.getAttribute("data-i")]); }; });
  }).catch(function(e){ document.getElementById("admListe").innerHTML = '<div class="bos">'+(/permission/.test((e&&e.code)||"") ? "Okuma izni yok: Firestore kuralına admin satırını ekle." : "Yüklenemedi: "+esc((e&&e.code)||e))+'</div>'; });
}
function adminKisi(x){
  var p = x.profil || {}, g = (x.geceler || []).slice().sort(function(a,b){ return b.y-a.y; }), h = istatHesap(x.geceler || []);
  var yuz = ["","😫","😕","😐","🙂","😄"];
  sayfa.innerHTML = '<h3>'+esc(p.ad || p.email || "Kullanıcı")+'</h3><p>'+esc(p.email || "")+(p.takma ? ' · '+esc(p.takma) : '')+(x.aktif ? '<br>🌙 '+hm(x.aktif)+'\'den beri uyuyor' : '')+'</p>'+
    (h ? '<div class="ozet"><div><b>'+sureYaz(h.ort)+'</b><span>ort. uyku</span></div><div><b>'+(h.duzen!=null ? h.duzen : '—')+'</b><span>düzen</span></div><div><b>🔥'+h.seri+'</b><span>seri</span></div></div>' : '')+
    grafSvg(g.slice(0, 7).reverse())+
    '<div style="margin-top:10px">'+(g.slice(0, 30).map(function(n){ var d = degerlendir(n);
      return '<div class="gece"><div class="g"><b>'+gunEt(n.k).split(" ").slice(1).join(" ")+'</b>'+GUN[new Date(n.k).getDay()]+'</div><div class="s">'+hm(n.y)+' → '+hm(n.k)+' · '+sureYaz(d.sure)+'<small>'+(n.p ? yuz[n.p] : '')+'</small></div>'+
        (d.yat==="ok" ? '<span class="etk ok">✅</span>' : d.yat==="er" ? '<span class="etk er">⏰</span>' : '<span class="etk no">❌</span>')+'</div>'; }).join("") || '<div class="bos">Kayıt yok.</div>')+'</div>'+
    '<button class="ikinci" id="geri">‹ Listeye dön</button>';
  document.getElementById("geri").onclick = adminAc;
}
document.getElementById("adminBtn").onclick = adminAc;
function hesapCiz(){
  var b = document.getElementById("hesapBtn");
  if(kullanici){
    var ad = (kullanici.displayName || kullanici.email || "Hesap").split(" ")[0];
    b.innerHTML = (kullanici.photoURL ? '<img src="'+esc(kullanici.photoURL)+'" alt="" referrerpolicy="no-referrer">' : '<span class="bos">🐬</span>')+'<span>'+esc(ad)+'</span>';
  } else b.innerHTML = '<span class="bos">👤</span><span>Giriş yap</span>';
  var y = document.getElementById("bulutYazi");
  y.textContent = !kullanici ? "Kayıtlar sadece bu cihazda. Telefon ve tablet aynı olsun diye giriş yap." :
    bulutDurum==="tamam" ? "☁️ Kayıtların hesabında, tüm cihazlarda aynı" : bulutDurum==="yukleniyor" ? "☁️ Eşitleniyor…" :
    bulutDurum==="izin" ? "☁️ Bulut kaydı henüz açık değil, kayıtlar bu cihazda tutuluyor" : bulutDurum==="hata" ? "☁️ Bulutla eşitlenemedi, tekrar denenecek" : "";
}
document.getElementById("hesapBtn").onclick = function(){
  if(!kullanici){
    sayfa.innerHTML = '<div class="sonuc"><img src="icon-192.png" alt="" style="width:72px;height:72px;border-radius:18px"><h3>DolphSleep\'e giriş yap</h3><p>Kayıtların hesabında saklanır, telefon ve tablette aynı olur. DolphEnglish hesabınla aynı Google hesabını kullanabilirsin.</p></div>'+
      '<button class="ana mavi" id="gGir"><svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Google ile giriş yap</button>'+
      '<button class="ikinci" id="tm">Şimdi değil</button>';
    ac(); document.getElementById("gGir").onclick = girisYap; document.getElementById("tm").onclick = kapat;
  } else {
    sayfa.innerHTML = '<h3>👤 Hesabın</h3><p>'+esc(kullanici.email || "")+'</p><p>'+esc(document.getElementById("bulutYazi").textContent)+'</p>'+
      '<button class="ana" id="tm">Tamam</button><button class="ikinci" id="tkm">🏆 Takma ad: '+esc(profil().takma || "yok")+'</button><button class="ikinci" id="cik">Çıkış yap</button>';
    ac(); document.getElementById("tm").onclick = kapat; document.getElementById("cik").onclick = cikisYap; document.getElementById("tkm").onclick = function(){ takmaSor(false); };
  }
};
function birlestir(a, b){
  var sil = Object.assign({}, a.silinen || {});
  Object.keys(b.silinen || {}).forEach(function(k){ sil[k] = Math.max(sil[k] || 0, b.silinen[k]); });
  var m = {};
  (a.geceler || []).concat(b.geceler || []).forEach(function(g){ if(!g || !g.id) return; if(!m[g.id] || (g.t || 0) > (m[g.id].t || 0)) m[g.id] = g; });
  var geceler = Object.keys(m).map(function(k){ return m[k]; }).filter(function(g){ return !(sil[g.id] && sil[g.id] >= (g.t || 0)); });
  var akt = (a.aktifT || 0) >= (b.aktifT || 0) ? a : b;
  return { geceler:geceler, aktif:akt.aktif || null, aktifT:akt.aktifT || 0, silinen:sil };
}
function bulutRef(){ return FBS.F.doc(FBS.db, "dolphsleep", kullanici.uid); }
function bulutBasla(){
  bulutDurum = "yukleniyor"; hesapCiz();
  FBS.F.getDoc(bulutRef()).then(function(s){
    var b = s.exists() ? (s.data() || {}) : {};
    var pr = (b.profilT || 0) > (veri.profilT || 0) ? b.profil : veri.profil, prT = Math.max(b.profilT || 0, veri.profilT || 0);
    veri = birlestir(veri, b); veri.uid = kullanici.uid; veri.profil = pr || {}; veri.profilT = prT; yaz(false); ciz();
    if(!profil().takma) takmaSor(true);
    return bulutYukle();
  }).catch(bulutHataYaz);
}
var bulutZ = 0;
function bulutYukleSonra(){ if(!kullanici || !FBS || bulutDurum==="izin") return; clearTimeout(bulutZ); bulutZ = setTimeout(bulutYukle, 800); }
function bulutYukle(){
  if(!kullanici || !FBS) return Promise.resolve();
  var pr = Object.assign({}, profil(), { ad:kullanici.displayName || "", email:kullanici.email || "", foto:kullanici.photoURL || "" });
  veri.profil = pr;
  return FBS.F.setDoc(bulutRef(), { geceler:veri.geceler, aktif:veri.aktif, aktifT:veri.aktifT, silinen:veri.silinen, profil:pr, profilT:veri.profilT || 0, guncel:Date.now(), sonGorulme:Date.now(), surum:SURUM })
    .then(function(){ bulutDurum = "tamam"; hesapCiz(); liderYukle(); }).catch(bulutHataYaz);
}
function bulutHataYaz(e){ bulutHata = (e && e.code) || String(e); bulutDurum = /permission/.test(bulutHata) ? "izin" : "hata"; hesapCiz(); }
document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="visible"){ ciz(); if(kullanici && FBS && bulutDurum!=="izin") bulutBasla(); } });
girisKapisi();
fbYukle().catch(function(){ document.getElementById("girisDurum").textContent = "Bağlanamadı. İnternetini kontrol edip sayfayı yenile."; try{ if(localStorage.getItem("dolphsleep.girdi")) document.getElementById("giris").hidden = true; }catch(e){} });

/* ---------- saat, yıldızlar, SW ---------- */
function saatCiz(){ document.getElementById("saat").textContent = hm(Date.now()); }
saatCiz(); setInterval(function(){ saatCiz(); ciz(); }, 30000);
(function(){
  var c = document.getElementById("yildiz"), x = c.getContext("2d"), y = [];
  function boyut(){ c.width = innerWidth*devicePixelRatio; c.height = innerHeight*devicePixelRatio; y = []; for(var i=0;i<90;i++) y.push([Math.random()*c.width, Math.random()*c.height*.7, Math.random()*1.4+.3, Math.random()*6]); }
  function d(t){ x.clearRect(0,0,c.width,c.height); y.forEach(function(s){ x.globalAlpha = .35 + .35*Math.sin(t/900 + s[3]); x.fillStyle = "#fff"; x.beginPath(); x.arc(s[0], s[1], s[2]*devicePixelRatio, 0, 7); x.fill(); }); requestAnimationFrame(d); }
  addEventListener("resize", boyut); boyut(); requestAnimationFrame(d);
})();
if("serviceWorker" in navigator) window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
hatirlatKur();
ciz();
</script>
